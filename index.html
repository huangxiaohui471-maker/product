    + '<div class="md-bd">' + body + '</div><div class="md-ft">' + foot + '</div>';
  $('#modal').classList.add('on');
  $('#mask').classList.add('on');
}
function download(name, text, mime) {
  try {
    var blob = new Blob([text], { type: (mime || 'application/json') + ';charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 400);
    toast('已导出 ' + name);
  } catch (e) { toast('导出失败，请检查浏览器权限'); }
}
function rowsForExport() {
  var list = isBrView() ? boardRankDataOf() : dataOf(), out = [];
  for (var i = 0; i < list.length; i++) {
    var o = {};
    for (var j = 0; j < FIELDS.length; j++) {
      var f = FIELDS[j];
      o[f.n] = (f.t === 'number') ? numField(list[i], f.n) : txtOf(list[i], f.n);
    }
    o._id = ridOf(list[i]);
    out.push(o);
  }
  return out;
}
function openMore() {
  var demoN = 0;
  for (var i = 0; i < state.list.length; i++) { if (isDemo(state.list[i])) demoN++; }
  var body = '<div class="hint">当前共 <b>' + state.list.length + '</b> 条商品数据，其中示例数据 <b>' + demoN + '</b> 条。'
    + (ONLINE ? '数据实时存在资料库云端，任意设备打开都是同一份。' : (IS_LOCAL ? '你现在打开的是本机那份文件，云端通道没接上，改动只留在这台设备。要和其他设备共用同一份数据，用下面的「打开线上版」。' : '线上通道暂未就绪，先存在这台设备上。')) + '</div>'
    + '<div class="hint" style="margin-top:10px">导出的 JSON 是完整快照，可作为备份留档；CSV 方便直接丢进 Excel 过一遍。</div>';
  var foot = (ONLINE ? '' : '<button type="button" class="btn" id="btnOnline2">打开线上版 · 云端同步</button>')
    + '<button type="button" class="btn sec" id="btnClearDemo"' + (demoN ? '' : ' disabled style="opacity:.45"') + '>清空示例数据</button>'
    + '<button type="button" class="btn sec" id="btnCsv">导出 CSV</button>'
    + '<button type="button" class="btn" id="btnJson">导出 JSON</button>';
  openModal('数据管理', body, foot);
  var bO2 = $('#btnOnline2');
  if (bO2) bO2.addEventListener('click', function () { window.open(ONLINE_URL, '_blank'); });
  $('#btnJson').addEventListener('click', function () {
    download('global-selection-' + dayStr(new Date()) + '.json', JSON.stringify({ exportedAt: new Date().toISOString(), count: state.list.length, records: rowsForExport() }, null, 2));
  });
  $('#btnCsv').addEventListener('click', function () {
    var names = FIELDS.map(function (f) { return f.n; });
    var lines = [names.join(',')];
    rowsForExport().forEach(function (o) {
      lines.push(names.map(function (n) {
        var v = o[n];
        if (v == null) return '';
        var s = String(v).replace(/"/g, '""');
        return /[",\n]/.test(s) ? '"' + s + '"' : s;
      }).join(','));
    });
    download('global-selection-' + dayStr(new Date()) + '.csv', '\ufeff' + lines.join('\n'), 'text/csv');
  });
  $('#btnClearDemo').addEventListener('click', clearDemo);
}
function clearDemo() {
  var targets = state.list.filter(isDemo);
  if (!targets.length) { toast('没有示例数据'); return; }
  if (!window.confirm('确定清空 ' + targets.length + ' 条示例数据？\n\n只会删掉标记为「示例」的记录，你自己导入的真实数据不受影响。此操作不可撤销。')) return;
  closeAll();
  var chain = Promise.resolve(), ok = 0;
  targets.forEach(function (r) {
    var rid = ridOf(r);
    chain = chain.then(function () { return removeOne(rid).then(function () { ok++; }).catch(function () { }); });
  });
  chain.then(function () { toast('已清空 ' + ok + ' 条示例数据'); return loadAll(); }).then(refreshAll);
}

/* ---------- 12. 事件绑定（统一入口调度，不在渲染函数里触发渲染） ---------- */
function bindEvents() {
  document.addEventListener('click', function (e) {
    var el = e.target && e.target.closest ? e.target.closest('[data-view],[data-f],[data-rank],[data-open],[data-close],[data-go],[data-drill],[data-tab],[data-close-tab],[data-board-tab],[data-opportunity-tab],[data-opportunity-refresh],[data-ing-market]') : null;
    if (!el) return;
    if (el.hasAttribute('data-ing-market')) { state.ingRadarMarket = el.getAttribute('data-ing-market'); refreshAll(); return; }
    if (el.hasAttribute('data-opportunity-tab')) { state.opportunityTab = el.getAttribute('data-opportunity-tab'); refreshAll(); return; }
    if (el.hasAttribute('data-opportunity-refresh')) {
      el.disabled = true; el.textContent = '同步中…';
      loadAll().then(function () { refreshAll(); toast('数据同步完成，已更新首次发现记录'); }).catch(function () { refreshAll(); toast('同步失败，请检查数据源连接'); });
      return;
    }
    if (el.hasAttribute('data-close')) { closeAll(); return; }
    if (el.hasAttribute('data-go')) {
      var g = el.getAttribute('data-go');
      if (g === 'import') { closeAll(); openImport(); }
      else if (g === 'srcmap') openSrcMap();
      else if (g === 'standards') openStandards();
      else if (g === 'export') { closeAll(); openMore(); }
      return;
    }
    /* 顶部标签：点击切换 / 点 × 关闭 */
    if (el.hasAttribute('data-close-tab')) { closeView(el.getAttribute('data-close-tab')); return; }
    if (el.hasAttribute('data-tab')) { switchView(el.getAttribute('data-tab')); return; }
    /* 侧边栏模块入口：打开（或聚焦）对应顶部标签 */
    if (el.hasAttribute('data-view')) { openView(el.getAttribute('data-view')); return; }
    if (el.hasAttribute('data-drill')) {
      /* 热力格 / 国家行下钻：继承当前筛选，叠加国家与类目后跳到榜单标签 */
      var dc = el.getAttribute('data-d-country'), dc2 = el.getAttribute('data-d-c2'), dcat = el.getAttribute('data-d-cat'), dsrc = el.getAttribute('data-d-src');
      if (dc !== null) state.country = dc || '全部';
      if (dc2 !== null) state.c2 = dc2 || '全部';
      if (dcat !== null) state.cat = dcat || '全部';
      if (dsrc !== null) state.src = dsrc || '全部';
      _openViewWithCurrent('rank');
      return;
    }
    if (el.hasAttribute('data-f')) {
      var f = el.getAttribute('data-f'), v = el.getAttribute('data-v');
      if (f === 'demoOnly') { state.demoOnly = (v === '1'); if (state.demoOnly) state.realOnly = false; }
      else if (f === 'realOnly') { state.realOnly = (v === '1'); if (state.realOnly) state.demoOnly = false; }
      else state[f] = v;
      if (f === 'kw') { var ki = $('#kw'); if (ki) ki.value = state.kw; }
      refreshAll(); return;
    }
    if (el.hasAttribute('data-rank')) { state.rankBy = el.getAttribute('data-rank'); refreshAll(); return; }
    if (el.hasAttribute('data-open')) { openDetail(el.getAttribute('data-open')); return; }
  });
  $('#mask').addEventListener('click', closeAll);
  $('#btnImport').addEventListener('click', openImport);
  $('#btnExport').addEventListener('click', openMore);
  $('#btnMore').addEventListener('click', openMore);
  var bo = $('#btnOnline');
  if (bo) bo.addEventListener('click', function () { window.open(ONLINE_URL, '_blank'); });
  var kw = $('#kw');
  var timer = null;
  kw.addEventListener('input', function () {
    clearTimeout(timer);
    timer = setTimeout(function () { if(state.view==='strategy')stCommitStrategySearch(kw.value);else{state.kw=kw.value.trim();refreshAll();} }, state.view==='strategy'?450:220);
  });
  kw.addEventListener('keydown',function(e){if(e.key==='Enter'&&state.view==='strategy'){e.preventDefault();clearTimeout(timer);stCommitStrategySearch(kw.value);}});
  kw.addEventListener('search',function(){if(state.view==='strategy'&&!kw.value){clearTimeout(timer);stCommitStrategySearch('');}});
  /* 下拉筛选 + 品类树展开 + 库内 Tab：一律「改 state → refreshAll」，不在渲染里触发渲染 */
  /* v11：筛选抽屉挂在 body 直下的 #fltLayer（topbar 有 backdrop-filter，会劫持 fixed 包含块），
     选择器委托必须提到 document 层才能接住抽屉里的下拉 */
  document.addEventListener('change', function (e) {
    var el = e.target;
    if (!el || !el.getAttribute) return;
    var f = el.getAttribute('data-f-sel');
    if (!f) return;
    state[f] = el.value;
    refreshAll();
  });
  $('#view').addEventListener('click', function (e) {
    var t = e.target && e.target.closest ? e.target.closest('[data-exp],[data-tab]') : null;
    if (!t) return;
    var tb = t.getAttribute('data-tab');
    if (tb) { state.libTab = tb; refreshAll(); return; }
    var lv = t.getAttribute('data-exp'), k = t.getAttribute('data-expk') || '';
    if (lv === 'l1') { if (state.expL1[k]) delete state.expL1[k]; else state.expL1[k] = 1; }
    else if (lv === 'l2') { if (state.expL2[k]) delete state.expL2[k]; else state.expL2[k] = 1; }
    refreshAll();
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeAll(); });
}

function init() {
  bindEvents();
  seedLocalIfEmpty();
  subscribeUpdates();
  refreshAll();
  loadAll().then(refreshAll);
  /* 持续记录当前视图的滚动位置，供切换视图时恢复（滚动节流） */
  var _scT = null;
  window.addEventListener('scroll', function () {
    if (_scT) return;
    _scT = setTimeout(function () {
      _scT = null;
      /* 滚动位置实时记进当前视图的快照（若无快照则建一个只含 scroll 的） */
      if (!_viewStates[state.view]) _viewStates[state.view] = {};
      _viewStates[state.view].scroll = _curScrollTop();
    }, 80);
  }, { passive: true });
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();
</script>

  }
  #spFetchCard .fc-warn {
    margin-top: 10px; padding: 9px 12px; border-radius: 9px; font-size: 12px; line-height: 1.5;
    background: rgba(255, 176, 76, .12); color: #ffc27a; border: 1px solid rgba(255, 176, 76, .25);
  }
  #spFetchCard .fc-actions {
    display: flex; gap: 10px; padding: 14px 18px; border-top: 1px solid rgba(255,255,255,.07);
  }
  #spFetchCard .fc-btn {
    flex: 1; min-height: 44px; border: none; border-radius: 10px; cursor: pointer;
    font-size: 14px; font-weight: 600;
  }
  #spFetchCard .fc-btn.cancel { background: rgba(255,255,255,.06); color: #c8cbd2; }
  #spFetchCard .fc-btn.cancel:hover { background: rgba(255,255,255,.1); }
  #spFetchCard .fc-btn.run { background: #7c5cff; color: #fff; }
  #spFetchCard .fc-btn.run:hover { background: #6b4cf5; }
  #spFetchCard .fc-btn:disabled { opacity: .5; cursor: not-allowed; }
</style>

<button id="spChatFab" aria-label="打开选品参谋">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
  </svg>
</button>

<div id="spChatPanel" role="dialog" aria-label="选品参谋对话">
  <div class="sp-chat-head">
    <div class="sp-title"><span class="sp-dot"></span>选品参谋</div>
    <button class="sp-chat-close" id="spChatClose" aria-label="关闭">×</button>
  </div>
  <div class="sp-chat-body" id="spChatBody"></div>
  <div class="sp-chat-input">
    <textarea id="spChatText" rows="1" placeholder="问选品问题，如：眼油赛道值不值得进？"></textarea>
    <button class="sp-chat-send" id="spChatSend">发送</button>
  </div>
</div>

<!-- 取数确认卡片（自定义弹层） -->
<div id="spFetchOverlay" role="dialog" aria-modal="true" aria-label="取数确认">
  <div id="spFetchCard">
    <div class="fc-head">
      <div class="fc-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
      </div>
      <div>
        <div class="fc-title">确认执行取数</div>
        <div class="fc-sub" id="fcScript">—</div>
      </div>
    </div>
    <div class="fc-body">
      <div class="fc-row"><span class="fc-label">说明</span><span class="fc-value" id="fcDesc">—</span></div>
      <div class="fc-row"><span class="fc-label">参数</span><span class="fc-value" id="fcArgs">—</span></div>
      <div class="fc-warn" id="fcWarn">—</div>
    </div>
    <div class="fc-actions">
      <button class="fc-btn cancel" id="fcCancel">取消</button>
      <button class="fc-btn run" id="fcRun">确认执行</button>
    </div>
  </div>
</div>

<script>
(function () {
  var CHAT_CONFIG = {
    endpoint: 'http://127.0.0.1:8000',
    token: 'dev-token-change-me'   // 与 agent_workbench/config.json 保持一致
  };

  var fab = document.getElementById('spChatFab');
  var panel = document.getElementById('spChatPanel');
  var body = document.getElementById('spChatBody');
  var textarea = document.getElementById('spChatText');
  var sendBtn = document.getElementById('spChatSend');
  var closeBtn = document.getElementById('spChatClose');
  var history = [];   // 会话上下文（最近 N 条由网关裁剪）
  var busy = false;

  // 页面跳转联动：改全局 state 后调 refreshAll()（页面暴露的全局函数）
  function applyNavigate(navState) {
    try {
      if (typeof window.state === 'undefined' || typeof window.refreshAll !== 'function') {
        return false;
      }
      var st = window.state;
      var view = navState.view;
      var keys = { market: 1, cat: 1, c2: 1, c3: 1, country: 1, kw: 1, src: 1, period: 1 };
      // 若有视图切换，走 openView（同步顶部标签 + 保存/恢复筛选快照）
      if (view && typeof window.openView === 'function') {
        // 先应用筛选字段，再切视图（openView 会把当前筛选快照存进旧视图）
        for (var k in navState) {
          if (keys[k]) st[k] = navState[k];
        }
        if (navState.cat) { st.c2 = '全部'; st.c3 = '全部'; }
        window.openView(view);
        return true;
      }
      for (var k2 in navState) {
        if (keys[k2]) st[k2] = navState[k2];
      }
      // 切品类时重置下级筛选，避免残留导致空白
      if (navState.cat) { st.c2 = '全部'; st.c3 = '全部'; }
      window.refreshAll();
      return true;
    } catch (e) {
      return false;
    }
  }

  // 打开商品详情：用商品名/商品ID 在页面 state.list 反查（不依赖 record_id）
  function openDetailByProduct(name, pid) {
    try {
      if (typeof window.state === 'undefined' || typeof window.openDetail !== 'function') return false;
      var list = window.state.list || [];
      for (var i = 0; i < list.length; i++) {
        var r = list[i];
        var nm = (r && (r['商品名称'] || r['名称'])) || '';
        var id = (r && (r['商品ID'] || r['商品id'])) || '';
        if ((name && nm === name) || (pid && id === pid) || (name && nm && nm.indexOf(name) >= 0)) {
          // 用页面自己的 ridOf 拿 id
          var rid = (typeof window.ridOf === 'function') ? window.ridOf(r) : (r._id || r.record_id || r.id);
          if (rid) { window.openDetail(rid); return true; }
        }
      }
      return false;
    } catch (e) {
      return false;
    }
  }

  // 按钮型消息：气泡内嵌一个可点按钮
  function addActionMsg(text, btnLabel, onClick) {
    var div = document.createElement('div');
    div.className = 'sp-msg ai';
    div.textContent = text;
    var btn = document.createElement('button');
    btn.className = 'sp-action-btn';
    btn.textContent = btnLabel;
    btn.addEventListener('click', onClick);
    div.appendChild(btn);
    body.appendChild(div);
    body.scrollTop = body.scrollHeight;
    return div;
  }

  function addMsg(role, text, cls) {
    var div = document.createElement('div');
    div.className = 'sp-msg ' + role + (cls ? ' ' + cls : '');
    div.textContent = text;
    body.appendChild(div);
    body.scrollTop = body.scrollHeight;
    return div;
  }

  function openPanel() {
    panel.classList.add('open');
    textarea.focus();
    if (!body.children.length) {
      addMsg('ai', '我是选品参谋，已经接入了全球选品平台的 400 条新品数据。\n可以问我：某个赛道值不值得进、某个成分机会大不大、某类目增速如何。');
    }
  }

  function closePanel() { panel.classList.remove('open'); }

  async function confirmFetch(plan) {
    var confirmId = plan.confirm_id;
    var overlay = document.getElementById('spFetchOverlay');
    var cancelBtn = document.getElementById('fcCancel');
    var runBtn = document.getElementById('fcRun');

    // 参数中文映射，让同事看得懂
    var argLabel = {
      limit: '条数上限', gap: '补齐缺口', only: '仅处理'
    };
    var argsHtml = '';
    var args = plan.args || {};
    var keys = Object.keys(args);
    if (!keys.length) {
      argsHtml = '（默认参数）';
    } else {
      argsHtml = keys.map(function (k) {
        return '<code>' + (argLabel[k] || k) + '</code> = ' + args[k];
      }).join('，');
    }

    document.getElementById('fcScript').textContent = plan.script || '';
    document.getElementById('fcDesc').textContent = plan.desc || '';
    document.getElementById('fcArgs').innerHTML = argsHtml;
    document.getElementById('fcWarn').textContent = (plan.note || '') + '。执行前请确认。';

    overlay.classList.add('show');

    // 等待用户点「确认执行」或「取消」
    var choice = await new Promise(function (resolve) {
      function cleanup() {
        runBtn.removeEventListener('click', onRun);
        cancelBtn.removeEventListener('click', onCancel);
        overlay.removeEventListener('click', onOverlay);
        overlay.classList.remove('show');
      }
      function onRun() { cleanup(); resolve(true); }
      function onCancel() { cleanup(); resolve(false); }
      function onOverlay(e) { if (e.target === overlay) { cleanup(); resolve(false); } }
      runBtn.addEventListener('click', onRun);
      cancelBtn.addEventListener('click', onCancel);
      overlay.addEventListener('click', onOverlay);
    });

    if (!choice) {
      addMsg('ai', '已取消取数计划。', 'thinking');
      return;
    }

    var think = addMsg('ai', '正在执行取数…', 'thinking');
    try {
      var resp = await fetch(CHAT_CONFIG.endpoint + '/execute_fetch', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Team-Token': CHAT_CONFIG.token },
        body: JSON.stringify({ confirm_id: confirmId })
      });
      var r = await resp.json();
      think.classList.remove('thinking');
      if (r.status === 'success') {
        think.textContent = '取数完成：' + r.script + '\n' + (r.stdout_tail ? r.stdout_tail.slice(-400) : '');
      } else if (r.status === 'failed') {
        think.textContent = '取数失败（returncode=' + r.returncode + '）：\n' + (r.stderr_tail || r.stdout_tail || '').slice(-400);
      } else {
        think.textContent = '取数状态：' + r.status + '\n' + (r.stdout_tail || '').slice(-400);
      }
    } catch (e) {
      think.remove();
      addMsg('ai', '取数出错：' + e.message, 'err');
    }
  }

  async function send() {
    var q = textarea.value.trim();
    if (!q || busy) return;
    addMsg('user', q);
    history.push({ role: 'user', content: q });
    textarea.value = '';
    textarea.style.height = 'auto';
    busy = true;
    sendBtn.disabled = true;
    var think = addMsg('ai', '思考中…', 'thinking');

    try {
      var resp = await fetch(CHAT_CONFIG.endpoint + '/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Team-Token': CHAT_CONFIG.token },
        body: JSON.stringify({ question: q, history: history })
      });
      if (!resp.ok) {
        var er = '';
        try { er = (await resp.json()).detail || ''; } catch (e) {}
        throw new Error('HTTP ' + resp.status + (er ? ' ' + er : ''));
      }
      // 解析 SSE 文本（网关当前为阻塞式全量返回，先 trace 后 delta）
      var raw = await resp.text();
      var answer = '';
      var pendingFetch = null;
      var navState = null;
      var openDetail = null;
      var lines = raw.split('\n');
      for (var i = 0; i < lines.length; i++) {
        var line = lines[i].trim();
        if (!line.startsWith('data:')) continue;
        var payload = line.slice(5).trim();
        if (!payload) continue;
        try {
          var obj = JSON.parse(payload);
          if (obj.error) throw new Error(obj.error);
          if (obj.progress) {
            think.textContent = '正在' + obj.progress + '…';
            body.scrollTop = body.scrollHeight;
          }
          if (obj.trace && obj.trace.length) {
            var toolNames = obj.trace.map(function (t) {
              var label = { query_products: '查商品', calc_metrics: '算指标', analyze_ingredient: '分析成分', list_fetch_scripts: '查取数能力', plan_fetch: '发起取数计划' }[t.tool] || t.tool;
              return label;
            }).join('、');
            think.textContent = '已查询：' + toolNames + '，正在整理结论…';
            body.scrollTop = body.scrollHeight;
          }
          if (obj.pending_fetch) { pendingFetch = obj.pending_fetch; }
          if (obj.navigate) { navState = obj.navigate; }
          if (obj.open_detail) { openDetail = obj.open_detail; }
          if (obj.delta) answer += obj.delta;
        } catch (e) {
          if (e.message && e.message.indexOf('JSON') === -1) throw e;
        }
      }
      think.classList.remove('thinking');
      if (answer) {
        think.textContent = answer;
        history.push({ role: 'assistant', content: answer });
      } else {
        think.textContent = '（无返回）';
      }
      // 页面跳转联动（混合：筛选/切Tab 这类无副作用动作直接跳）
      if (navState) {
        var jumped = applyNavigate(navState);
        if (jumped) {
          var navDesc = [];
          if (navState.view) navDesc.push('已切换到对应页面');
          if (navState.market) navDesc.push('市场：' + navState.market);
          if (navState.cat) navDesc.push('品类：' + navState.cat);
          if (navState.kw) navDesc.push('搜索：' + navState.kw);
          if (navDesc.length) addMsg('ai', '↳ ' + navDesc.join(' · '), 'thinking');
        }
      }
      // 打开商品详情（有焦点动作，走按钮确认）
      if (openDetail && openDetail.product_name) {
        addActionMsg('已定位到商品「' + openDetail.product_name + '」', '打开商品详情', function () {
          var ok = openDetailByProduct(openDetail.product_name, openDetail.product_id);
          if (!ok) addMsg('ai', '未能打开该商品详情（可能商品不在当前列表里）。', 'err');
        });
      }
      // 取数二次确认
      if (pendingFetch) { await confirmFetch(pendingFetch); }
    } catch (e) {
      think.remove();
      addMsg('ai', '出错了：' + e.message, 'err');
    } finally {
      busy = false;
      sendBtn.disabled = false;
      textarea.focus();
    }
  }

  fab.addEventListener('click', openPanel);
  closeBtn.addEventListener('click', closePanel);
  sendBtn.addEventListener('click', send);
  textarea.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });
  textarea.addEventListener('input', function () {
    textarea.style.height = 'auto';
    textarea.style.height = Math.min(textarea.scrollHeight, 120) + 'px';
  });
})();
</script>

</body>
