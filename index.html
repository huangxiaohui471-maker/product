:root{
  --bg:#F4F4F7;--surface:#FFFFFF;--surface-2:#FAFAFC;
  --line:#E7E7EC;--line-2:#F1F1F5;
  --text:#17171B;--sub:#5E5F67;--hint:#8A8B93;
  --blue:#0071E3;--blue-soft:#EAF3FE;--blue-deep:#0058B0;
  --up:#D93A2B;--up-soft:#FDEDEB;--down:#12855A;--down-soft:#E9F7EF;
  --amber:#A86300;--amber-soft:#FEF3E2;--purple:#6A45D0;--purple-soft:#F1EDFC;
  --teal:#0C7A6A;--teal-soft:#E5F5F1;
  --r:12px;--r-s:9px;--r-l:16px;--r-xl:22px;
  --sh:0 1px 2px rgba(16,24,40,.05);
  /* v13：历史命名别名。--card/--t1/--t2 在 v10 CSS 里有 19 处使用但从未定义，
     激活 Tab「透明底白字」几乎不可见即此因；在 :root 一次性补齐 */
  --card:var(--surface);--t1:var(--text);--t2:var(--sub);
  --sh-1:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.05);
  --sh-2:0 10px 26px -12px rgba(16,24,40,.22),0 2px 6px rgba(16,24,40,.05);
  --sh-3:0 26px 60px -26px rgba(10,16,48,.62),0 2px 10px rgba(10,16,48,.12);
  --grad-hero:linear-gradient(142deg,#0B1124 0%,#141A3B 46%,#201540 100%);
  --side-w:212px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;overflow-x:hidden}
body{
  background:var(--bg);color:var(--text);
  font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
h1,h2,h3,p{margin:0}
svg{display:block}
.ic{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ic-s{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* ---------- 布局 ---------- */
.app{display:block}
.side{
  position:fixed;left:0;top:0;bottom:0;width:var(--side-w);z-index:30;
  background:var(--surface);border-right:1px solid var(--line);
  display:flex;flex-direction:column;padding:16px 12px;
}
.brand{display:flex;align-items:center;gap:9px;padding:4px 8px 18px}
.brand-mark{
  width:30px;height:30px;border-radius:9px;background:var(--blue);color:#fff;
  display:flex;align-items:center;justify-content:center;flex:none;
}
.brand-mark svg{width:17px;height:17px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.brand-text{min-width:0}
.brand-text b{display:block;font-size:14px;font-weight:500;letter-spacing:.2px}
.brand-text i{display:block;font-style:normal;font-size:10.5px;color:var(--hint);letter-spacing:.3px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-item{
  display:flex;align-items:center;gap:10px;min-height:44px;padding:0 10px;
  border-radius:var(--r-s);color:var(--sub);font-size:13.5px;text-align:left;width:100%;
}
.nav-item:hover{background:var(--surface-2);color:var(--text)}
.nav-item.on{background:var(--blue-soft);color:var(--blue-deep);font-weight:500}
.nav-item .n{margin-left:auto;font-size:11.5px;color:var(--hint);font-weight:400}
.side-foot{margin-top:auto;padding-top:12px;border-top:1px solid var(--line-2)}
.sync{display:flex;align-items:center;gap:7px;padding:8px 10px 10px;font-size:11.5px;color:var(--hint)}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--down);flex:none}
.sync-dot.off{background:var(--hint)}
.sync-dot.busy{background:var(--amber);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.28}}
.side-actions{display:flex;gap:6px}
.side-actions button{
  flex:1;min-height:36px;border-radius:var(--r-s);background:var(--surface-2);
  border:1px solid var(--line);font-size:12.5px;color:var(--sub);
}
.side-actions button:hover{border-color:#D5D5DA;color:var(--text)}

.main{margin-left:var(--side-w);min-height:100vh;padding-bottom:32px;min-width:0;max-width:calc(100vw - var(--side-w));overflow-x:hidden}
.topbar{
  position:sticky;top:0;z-index:20;background:rgba(245,245,247,.86);
  backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--line);padding:14px 24px 0;
}
.topbar-row{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap}
.topbar-title h1{font-size:19px;font-weight:500;letter-spacing:.2px}
.topbar-title p{font-size:12.5px;color:var(--hint);margin-top:3px}
.topbar-tools{margin-left:auto;display:flex;align-items:center;gap:8px}
.search{
  display:flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--line);
  border-radius:9px;padding:0 11px;height:38px;min-width:250px;
}
.search svg{color:var(--hint);flex:none}
.search input{
  border:0;outline:0;background:none;font-size:13.5px;width:100%;height:100%;
}
.icon-btn{
  width:38px;height:38px;border-radius:9px;background:var(--surface);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;color:var(--sub);
}
.icon-btn:hover{border-color:#D5D5DA;color:var(--text)}
.chips{display:flex;gap:6px;align-items:center;padding:11px 0 13px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:none;height:30px;padding:0 12px;border-radius:15px;background:var(--surface);
  border:1px solid var(--line);font-size:12.5px;color:var(--sub);white-space:nowrap;
}
.chip:hover{border-color:#D5D5DA}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.chip .cn{font-size:10.5px;opacity:.6;margin-left:3px}
.chip-sep{flex:none;width:1px;height:18px;background:var(--line);margin:0 5px}
.view{padding:18px 24px 40px;min-width:0;max-width:100%;overflow-x:hidden}

/* ---------- 通用块 ---------- */
.sec{margin-bottom:22px}
.sec-hd{display:flex;align-items:baseline;gap:10px;margin-bottom:11px}
.sec-hd h2{font-size:15px;font-weight:500}
.sec-hd span{font-size:12px;color:var(--hint)}
.sec-hd .r{margin-left:auto;font-size:12px;color:var(--hint)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.grid{display:grid;gap:12px}
.g-kpi{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.g-2{grid-template-columns:1fr 1fr}
.g-3{grid-template-columns:repeat(3,1fr)}
.kpi{padding:14px 16px}
.kpi .lb{font-size:12px;color:var(--hint)}
.kpi .vl{font-size:22px;font-weight:500;margin-top:5px;letter-spacing:.3px}
.kpi .vl small{font-size:12.5px;font-weight:400;color:var(--hint);margin-left:3px}
.kpi .ft{font-size:11.5px;color:var(--hint);margin-top:4px}
.pad{padding:16px}
.up{color:var(--up)}
.down{color:var(--down)}
.muted{color:var(--hint)}
.board-controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 0 13px}
.board-controls label{display:flex;align-items:center;gap:8px;color:var(--hint);font-size:12px}
.board-controls select{height:34px;min-width:125px;padding:0 28px 0 10px;border:1px solid var(--line);border-radius:9px;background:#fff;font-size:12.5px;color:var(--text)}
.board-date{margin-left:auto;color:var(--hint);font-size:12px}
.board-hero{display:grid;grid-template-columns:minmax(260px,1fr) minmax(400px,1.2fr);gap:24px;align-items:center;padding:24px;border-radius:18px;color:#fff;background:linear-gradient(115deg,#111a39,#20265b 64%,#30305f);margin:0 0 20px}
.board-eyebrow{font-size:11px;letter-spacing:.08em;color:#aebce4}
.board-hero-main h2{font-size:22px;line-height:1.45;margin:10px 0 7px;font-weight:600}
.board-live-broadcast{float:right;margin:1px 0 0 14px;color:#73f0d7;font-size:12px;font-weight:600;letter-spacing:.04em;white-space:nowrap}
.board-hero-main p{font-size:12px;color:#b4bdd6}
.board-hero-actions{display:flex;gap:8px;margin-top:16px}
.board-hero-actions button{height:34px;padding:0 12px;border:1px solid rgba(255,255,255,.25);border-radius:8px;color:#fff;background:rgba(255,255,255,.08);font-size:12px}
.board-hero-actions button:first-child{background:#fff;color:#182044;border-color:#fff;font-weight:600}
.board-stats{display:grid;grid-template-columns:repeat(4,minmax(90px,1fr));gap:8px}
.board-stat{padding:12px;border:1px solid rgba(255,255,255,.12);border-radius:12px;background:rgba(255,255,255,.07);min-width:0}
.board-stat span,.board-stat small{display:block;color:#aeb8d2;font-size:10.5px}
.board-stat b{display:block;margin:6px 0;font-size:22px;line-height:1.1;white-space:nowrap}
.growth-hero{display:block;padding:0;overflow:hidden}
.growth-hero-slides{min-width:0}
.growth-hero-slide{display:none;grid-template-columns:minmax(260px,1fr) minmax(400px,1.2fr);gap:24px;align-items:center;padding:24px}
.growth-hero-slide.on{display:grid}
.growth-hero-live{float:right;margin:1px 0 0 14px;color:#73f0d7;font-size:12px;font-weight:600;letter-spacing:.04em;white-space:nowrap}
.growth-hero-footer{display:flex;align-items:center;gap:12px;padding:9px 24px 11px;border-top:1px solid rgba(255,255,255,.13);background:rgba(4,12,37,.22);color:#aebce4;font-size:10px}
.growth-hero-footer b{color:#73f0d7;font-weight:600;white-space:nowrap}
.growth-hero-progress{height:3px;flex:1;overflow:hidden;border-radius:99px;background:rgba(255,255,255,.16)}
.growth-hero-progress i{display:block;width:0;height:100%;border-radius:inherit;background:linear-gradient(90deg,#42c6ff,#57e1c2)}
.growth-hero-footer button{width:23px;height:23px;border:1px solid rgba(255,255,255,.24);border-radius:6px;color:#dbe7ff;background:rgba(255,255,255,.08);font-size:14px;line-height:1;cursor:pointer}
.board-section{margin-bottom:16px;padding:18px 20px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh)}
.board-section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.board-section-head h2{font-size:15px;font-weight:600}
.board-section-head p{margin-top:3px;color:var(--hint);font-size:11.5px}
.board-section-head>span{color:var(--hint);font-size:11px}
.board-section-head button{padding:7px 10px;border:1px solid var(--line);border-radius:8px;color:var(--blue);background:#fff;font-size:11.5px;white-space:nowrap}
.board-growth-list,.board-ingredient-list{display:grid;gap:2px}
.board-growth-row{display:grid;grid-template-columns:minmax(175px,1.1fr) minmax(110px,1fr) 90px 155px;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line-2)}
.board-growth-row:last-child,.board-ingredient-row:last-child{border-bottom:0}
.board-growth-name b,.board-growth-name small{display:block}
.board-growth-name b{font-size:12.5px;font-weight:500}
.board-growth-name small,.board-growth-meta{font-size:10.5px;color:var(--hint)}
.board-bar{height:8px;border-radius:8px;background:#f0f1f5;overflow:hidden}
.board-bar i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,#f58c8c,#dc3c43)}
.board-growth-value{text-align:right;font-size:13px;white-space:nowrap}
.growth-radar{display:grid;gap:12px;margin-bottom:18px;min-width:0;overflow:hidden}.growth-radar-hero{padding:18px 20px;border-radius:18px;color:#fff;background:radial-gradient(circle at 86% 12%,rgba(61,214,190,.24),transparent 28%),linear-gradient(120deg,#10224b,#173e68 55%,#12645f);box-shadow:0 12px 30px rgba(20,43,88,.16);min-width:0}.growth-radar-kicker{display:flex;align-items:center;gap:8px;color:#9cefe1;font-size:11px;letter-spacing:.08em;text-transform:uppercase}.growth-radar-kicker i{width:7px;height:7px;border-radius:50%;background:#54e3c8;box-shadow:0 0 0 5px rgba(84,227,200,.13)}.growth-radar-hero h2{margin:10px 0 6px;font-size:22px;line-height:1.3}.growth-radar-hero p{margin:0;color:#bed3e7;font-size:12px}.growth-radar-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:14px}.growth-radar-stat{padding:10px 11px;border:1px solid rgba(255,255,255,.14);border-radius:11px;background:rgba(255,255,255,.08);min-width:0}.growth-radar-stat span,.growth-radar-stat small{display:block;color:#a8bfd6;font-size:10px}.growth-radar-stat b{display:block;margin:4px 0;font-size:18px;white-space:nowrap}.growth-ticker{min-width:0}.growth-ticker-viewport{overflow:hidden;border-radius:14px}.growth-ticker-track{display:flex;gap:10px;transition:transform .45s cubic-bezier(.22,.61,.36,1);will-change:transform}.growth-ticker-card{flex:0 0 calc((100% - 20px)/3);min-width:0;min-height:96px;padding:13px;border:1px solid #dbe5ee;border-radius:14px;background:linear-gradient(145deg,#fff,#f5fbfa);box-shadow:0 5px 16px rgba(31,67,96,.06)}.growth-ticker-card .top{display:flex;justify-content:space-between;gap:8px;align-items:center}.growth-ticker-card b{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.growth-ticker-card .rise{color:#07866f;font-size:17px;font-weight:700;white-space:nowrap}.growth-ticker-card p{margin:7px 0 0;color:var(--hint);font-size:10.5px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.growth-ticker-controls{display:flex;align-items:center;gap:10px;margin-top:8px}.growth-ticker-controls small{color:var(--hint);font-size:10px}.growth-ticker-progress{height:3px;flex:1;overflow:hidden;border-radius:99px;background:#e5edf5}.growth-ticker-progress i{display:block;width:0;height:100%;border-radius:inherit;background:linear-gradient(90deg,#2b79df,#3bd2c3)}.growth-ticker-controls button{width:24px;height:24px;border:1px solid #d7e2ec;border-radius:7px;color:#2774cb;background:#fff;font-size:13px;line-height:1}.growth-radar-panel{padding:15px 17px;border:1px solid var(--line);border-radius:14px;background:#fff;box-shadow:var(--sh)}.growth-radar-panel-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:10px}.growth-radar-panel-head h2{font-size:15px}.growth-radar-panel-head p{margin-top:3px;color:var(--hint);font-size:11px}.growth-country-tabs,.growth-category-tabs{display:flex;gap:7px;overflow:auto;padding-bottom:3px;margin-bottom:11px}.growth-country-tabs button,.growth-category-tabs button{flex:0 0 auto;padding:7px 13px;border:1px solid #dfe6ee;border-radius:999px;background:#fff;color:#536176;font:inherit;font-size:11px;cursor:pointer}.growth-country-tabs button.on,.growth-category-tabs button.on{color:#fff;background:#0e8d82;border-color:#0e8d82}.growth-category-list{display:grid;gap:3px}.growth-category-row{display:grid;grid-template-columns:180px minmax(120px,1fr) 84px 145px;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line-2)}.growth-category-row:last-child{border-bottom:0}.growth-category-name b,.growth-category-name small{display:block}.growth-category-name b{font-size:12px}.growth-category-name small{margin-top:2px;color:var(--hint);font-size:9.5px}.growth-category-bar{height:7px;border-radius:99px;background:#edf2f5;overflow:hidden}.growth-category-bar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,#2ecbb2,#2777da)}.growth-category-rate{font-size:12px;font-weight:700;text-align:right}.growth-category-meta{color:var(--hint);font-size:10px}.growth-product-table{width:100%;border-collapse:collapse;min-width:720px}.growth-product-table th{padding:7px 9px;text-align:left;color:#8995a5;font-size:10px;font-weight:500;background:#f7f9fb}.growth-product-table td{padding:8px 9px;border-bottom:1px solid var(--line-2);font-size:11px;vertical-align:middle}.growth-product-table tr:last-child td{border-bottom:0}.growth-product-table .rank{display:inline-flex;width:22px;height:22px;border-radius:7px;align-items:center;justify-content:center;background:#edf5f6;color:#0b8276;font-weight:700}.growth-product-table .product-name{font-weight:600}.growth-product-table .sub{display:block;margin-top:3px;color:var(--hint);font-size:10px}.growth-product-table .source{color:#64748b;font-size:10.5px}.growth-radar-note{padding:9px 11px;border-radius:9px;background:#f5f8fb;color:#768397;font-size:10px;line-height:1.5}
.board-ingredient-row{display:grid;grid-template-columns:minmax(100px,150px) minmax(100px,170px) minmax(110px,1fr) 82px minmax(130px,auto);align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line-2)}
.board-ingredient-row>b:first-child{font-size:12px;font-weight:500}
.board-ingredient-row>span,.board-ingredient-row>small{font-size:10.5px;color:var(--hint)}
.board-empty{padding:20px 12px;border-radius:10px;background:var(--surface-2);color:var(--hint);font-size:12px}
.board-footnote{padding:0 2px;color:var(--hint);font-size:10.5px}
.opportunity-tabs{display:flex;gap:8px;margin:2px 0 16px;padding:4px;background:#eef1f8;border-radius:12px;width:max-content;max-width:100%}
.opportunity-tabs button{border:0;border-radius:9px;padding:10px 15px;background:transparent;color:var(--sub);font-size:13px;font-weight:600;cursor:pointer}
.opportunity-tabs button.on{background:#fff;color:var(--blue);box-shadow:0 2px 8px rgba(25,45,90,.1)}
.opportunity-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.opportunity-top h2{font-size:17px;margin-bottom:4px}.opportunity-top p,.opportunity-explain{font-size:12px;color:var(--hint)}
.opportunity-top button,.opportunity-empty button{height:36px;padding:0 13px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--blue);font-size:12px;cursor:pointer;white-space:nowrap}
.opportunity-cards{display:grid;gap:10px}
.opportunity-card{display:grid;grid-template-columns:38px minmax(180px,1fr) minmax(130px,.7fr) 125px;gap:13px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:12px;background:#fff}
.opportunity-rank{width:32px;height:32px;display:grid;place-items:center;border-radius:10px;background:#eef5ff;color:var(--blue);font-weight:700}
.opportunity-product b,.opportunity-product small{display:block}.opportunity-product b{font-size:13px;font-weight:600;line-height:1.4}.opportunity-product small,.opportunity-meta{color:var(--hint);font-size:11px;margin-top:4px}
.opportunity-growth{text-align:right;font-size:18px;font-weight:700;color:#d84a45}.opportunity-growth small{display:block;color:var(--hint);font-size:10px;font-weight:400}
.opportunity-empty{padding:26px 18px;border:1px dashed #cbd5e7;border-radius:12px;background:#f8faff;text-align:center;color:var(--sub)}
.opportunity-empty b{display:block;margin-bottom:7px;font-size:14px}.opportunity-empty p{font-size:12px;color:var(--hint);line-height:1.7;margin-bottom:12px}
.opportunity-note{margin-top:12px;padding:12px 14px;border-radius:10px;background:#f7f8fb;color:var(--hint);font-size:11px;line-height:1.7}
.opportunity-radar-frame{display:block;width:100%;height:calc(100vh - 160px);min-height:760px;border:0;border-radius:12px;background:#fbfbf8}
.cross-market-head{padding:18px 20px;border:1px solid #CFE1F7;border-radius:14px;background:linear-gradient(135deg,#F7FBFF,#EEF6FF);margin-bottom:12px}
.cross-market-head h2{font-size:18px;margin:7px 0 5px}.cross-market-head p{font-size:11px;color:var(--sub);line-height:1.65}
.cross-market-status{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.cross-market-status span{padding:6px 9px;border-radius:999px;background:#fff;border:1px solid #D9E7F7;color:#51647E;font-size:10px}.cross-market-status .ok{color:#167848;background:#E8F6EE;border-color:#C9EBD8}.cross-market-status .warn{color:#8A5B18;background:#FFF7E7;border-color:#F5DFB0}
.cross-market-config{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:12px 0}.cross-market-config article{padding:14px;border:1px solid var(--line);border-radius:12px;background:#fff}.cross-market-config b,.cross-market-config small{display:block}.cross-market-config b{font-size:12px}.cross-market-config small{font-size:10px;color:var(--hint);line-height:1.55;margin-top:5px}
.cross-market-direction{display:flex;gap:8px;margin:12px 0}.cross-market-direction button{min-height:38px;padding:0 15px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--sub);font-size:12px;font-weight:600}.cross-market-direction button.on{background:#122044;border-color:#122044;color:#fff}
.cross-market-flow{display:grid;grid-template-columns:1fr 40px 1fr;gap:10px;align-items:stretch;margin:12px 0}.cross-market-flow article{padding:14px;border:1px solid var(--line);border-radius:12px;background:#fff}.cross-market-flow article h3{font-size:12px;margin-bottom:6px}.cross-market-flow article p{font-size:10px;color:var(--hint);line-height:1.6}.cross-market-arrow{display:grid;place-items:center;color:var(--blue);font-size:20px}
.cross-market-empty{padding:25px 18px;border:1px dashed #BFD2EA;border-radius:12px;background:#FAFCFF;text-align:center}.cross-market-empty b{display:block;font-size:14px;margin-bottom:7px}.cross-market-empty p{font-size:11px;color:var(--hint);line-height:1.7}.cross-market-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}.cross-market-actions button{height:36px;padding:0 13px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--blue);font-size:11px}.cross-market-actions button.primary{background:var(--blue);border-color:var(--blue);color:#fff}
@media(max-width:760px){.cross-market-config{grid-template-columns:1fr}.cross-market-flow{grid-template-columns:1fr}.cross-market-arrow{transform:rotate(90deg);height:22px}}
.tag{
  display:inline-flex;align-items:center;height:21px;padding:0 8px;border-radius:6px;
  font-size:11.5px;background:var(--surface-2);border:1px solid var(--line);color:var(--sub);white-space:nowrap;
}
.tag.b{background:var(--blue-soft);border-color:#CFE4FB;color:var(--blue-deep)}
.tag.r{background:var(--up-soft);border-color:#F8D7D2;color:#A52214}
.tag.g{background:var(--down-soft);border-color:#CFE8D8;color:#14663A}
.tag.a{background:var(--amber-soft);border-color:#FBE0B4;color:var(--amber)}
.tag.p{background:var(--purple-soft);border-color:#DDD3F8;color:var(--purple)}
.tag.t{background:var(--teal-soft);border-color:#C7E8E1;color:var(--teal)}
.empty{padding:44px 20px;text-align:center;color:var(--hint);font-size:13px}
.empty b{display:block;color:var(--sub);font-weight:500;font-size:14px;margin-bottom:5px}

/* ---------- 榜单 ---------- */
.rank-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.rank-tab{
  min-height:34px;padding:0 14px;border-radius:17px;background:var(--surface);
  border:1px solid var(--line);font-size:13px;color:var(--sub);
}
.rank-tab.on{background:var(--text);border-color:var(--text);color:#fff}
.rk-list{display:flex;flex-direction:column}
.rk{
  display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;
  padding:12px 16px;border-bottom:1px solid var(--line-2);text-align:left;width:100%;
}
.rk:last-child{border-bottom:0}
.rk:hover{background:var(--surface-2)}
.rk-no{font-size:15px;font-weight:500;color:var(--hint);text-align:center}
.rk-no.top{color:var(--blue)}
.rk-main{min-width:0}
.rk-name{font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rk-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:5px;font-size:11.5px;color:var(--hint)}
.rk-val{text-align:right;font-size:14px;font-weight:500;white-space:nowrap}
.rk-val small{display:block;font-size:11px;font-weight:400;color:var(--hint);margin-top:3px}
.bar{display:block;height:4px;border-radius:2px;background:var(--line-2);margin-top:7px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:2px;background:var(--blue)}

/* ---------- 卡片流 ---------- */
.cards{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(232px,1fr))}
.pc{padding:14px;text-align:left;display:block;width:100%}
.pc-hd{display:flex;align-items:flex-start;gap:8px;margin-bottom:8px}
.pc-name{font-size:13.5px;font-weight:500;line-height:1.45;flex:1;min-width:0}
.pc-price{font-size:15px;font-weight:500;white-space:nowrap}
.pc-brand{font-size:11.5px;color:var(--hint);margin-bottom:9px}
.pc-kv{display:flex;justify-content:space-between;gap:8px;font-size:12px;padding:3px 0}
.pc-kv span:first-child{color:var(--hint)}
.pc-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}

.dw-product-hero{display:grid;place-items:center;margin-top:14px;min-height:190px;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:var(--surface-2);color:var(--hint);font-size:11px}.dw-product-hero img{display:block;width:100%;max-height:330px;object-fit:contain;background:#fff}

/* ---------- 洞察 ---------- */
.ins{padding:16px;display:flex;flex-direction:column;gap:11px}
.ins-hd{display:flex;align-items:flex-start;gap:10px}
.ins-icon{
  width:32px;height:32px;border-radius:9px;flex:none;display:flex;align-items:center;justify-content:center;
  background:var(--blue-soft);color:var(--blue-deep);
}
.ins-icon.r{background:var(--up-soft);color:#A52214}
.ins-icon.g{background:var(--down-soft);color:#14663A}
.ins-icon.p{background:var(--purple-soft);color:var(--purple)}
.ins-t{font-size:14px;font-weight:500}
.ins-d{font-size:12.5px;color:var(--sub);margin-top:2px}
.ins-ev{background:var(--surface-2);border-radius:var(--r-s);padding:10px 12px;font-size:12.5px;color:var(--sub)}
.ins-ev b{color:var(--text);font-weight:500}
.ins-list{display:flex;flex-direction:column;gap:1px}
.ins-row{
  display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:var(--r-s);
  background:var(--surface);border:1px solid var(--line-2);text-align:left;width:100%;
}
.ins-row:hover{border-color:#D5D5DA}
.ins-row .nm{flex:1;min-width:0;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ins-row .vv{font-size:12.5px;font-weight:500;white-space:nowrap}

/* ---------- 抽屉 / 弹层 ---------- */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.28);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.mask.on{opacity:1;pointer-events:auto}
.drawer{
  position:fixed;top:0;right:0;bottom:0;width:min(460px,92vw);background:var(--surface);z-index:50;
  transform:translateX(101%);transition:transform .26s cubic-bezier(.32,.72,0,1);
  display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.1);
}
.drawer.on{transform:none}
.dw-hd{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.dw-hd h3{font-size:15px;font-weight:500;flex:1;line-height:1.45}
.dw-bd{flex:1;overflow-y:auto;padding:4px 18px 30px;-webkit-overflow-scrolling:touch}
.dw-grp{font-size:11.5px;color:var(--hint);padding:16px 0 7px;border-bottom:1px solid var(--line-2);margin-bottom:2px}
.dw-r{display:flex;gap:14px;padding:9px 0;border-bottom:1px solid var(--line-2);font-size:13px}
.dw-r .k{width:96px;flex:none;color:var(--hint);font-size:12.5px}
.dw-r .v{flex:1;word-break:break-word}
.dw-note{margin-top:14px;background:var(--surface-2);border-radius:var(--r-s);padding:12px;font-size:12.5px;color:var(--sub);line-height:1.7}
.modal{
  position:fixed;left:50%;top:50%;transform:translate(-50%,-46%);width:min(620px,94vw);max-height:86vh;
  background:var(--surface);border-radius:var(--r-l);z-index:50;display:none;flex-direction:column;
  box-shadow:0 20px 60px rgba(0,0,0,.2);overflow:hidden;
}
.modal.on{display:flex}
.modal.wide{width:min(1000px,94vw)}
.md-hd{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.md-hd h3{font-size:15px;font-weight:500;flex:1}
.md-bd{padding:18px;overflow-y:auto}
.md-ft{padding:13px 18px;border-top:1px solid var(--line);display:flex;gap:9px;justify-content:flex-end;flex-wrap:wrap}
.btn{
  min-height:40px;padding:0 18px;border-radius:9px;background:var(--blue);color:#fff;font-size:13.5px;
}
.btn:hover{background:var(--blue-deep)}
.btn.sec{background:var(--surface);color:var(--sub);border:1px solid var(--line)}
.btn.sec:hover{border-color:#D5D5DA;color:var(--text)}
.btn.danger{background:var(--up)}
textarea.ta{
  width:100%;min-height:190px;border:1px solid var(--line);border-radius:var(--r-s);padding:11px;
  font-size:13px;line-height:1.6;outline:0;resize:vertical;background:var(--surface-2);
}
textarea.ta:focus{border-color:var(--blue);background:var(--surface)}
.hint{font-size:12px;color:var(--hint);line-height:1.7}
.toast{
  position:fixed;left:50%;bottom:76px;transform:translate(-50%,14px);z-index:70;
  background:rgba(29,29,31,.93);color:#fff;font-size:13px;padding:10px 17px;border-radius:10px;
  opacity:0;pointer-events:none;transition:.22s;max-width:88vw;text-align:center;
}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- 图表辅助 / 市场对比 ---------- */
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:10px}
.lg{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--sub)}
.lg i{width:9px;height:9px;border-radius:50%;display:inline-block}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:7px;vertical-align:1px}
.cmp-hd,.cmp-r{
  display:grid;grid-template-columns:1.2fr .8fr 1.1fr 1fr .9fr 1.1fr;gap:8px;
  align-items:center;padding:10px 16px;font-size:12.5px;
}
.cmp-hd{color:var(--hint);font-size:11.5px;border-bottom:1px solid var(--line)}
.cmp-r{border-bottom:1px solid var(--line-2)}
.cmp-r:last-child{border-bottom:0}
.cmp-hd span:nth-child(n+2),.cmp-r span:nth-child(n+2){text-align:right}
.cmp-r span:first-child{font-weight:500}
.rk-name{display:block}
.pc-brand{display:block}
.ins-t,.ins-d{display:block}
.ins-hd>span:last-child{flex:1;min-width:0}
@media (max-width:860px){
  .cmp-hd{display:none}
  .cmp-r{grid-template-columns:1fr 1fr;grid-auto-rows:auto;gap:6px 10px;padding:12px 14px;font-size:12.5px}
  .cmp-r span:nth-child(n+2){text-align:right}
  .cmp-r span:first-child{grid-column:1 / -1}
}
/* ---------- 移动端 ---------- */
.tabbar{display:none}
@media (max-width:860px){
  .side{display:none}
  .main{margin-left:0;padding-bottom:calc(72px + env(safe-area-inset-bottom))}
  .topbar{padding:12px 14px 0}
  .view{padding:14px 14px 24px}
  .topbar-title h1{font-size:17px}
  .topbar-tools{width:100%;margin-left:0}
  .search{min-width:0;flex:1}
  .g-2,.g-3{grid-template-columns:1fr}
  .cards{grid-template-columns:1fr}
  .rk{grid-template-columns:28px 1fr auto;gap:9px;padding:11px 13px}
  .rk-name{font-size:13px}
  .tabbar{
    display:flex;position:fixed;left:0;right:0;bottom:0;z-index:35;
    background:rgba(255,255,255,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);
  }
  .tabbar button{
    flex:1;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    color:var(--hint);font-size:10.5px;
  }
  .tabbar button.on{color:var(--blue)}
  .toast{bottom:calc(72px + env(safe-area-inset-bottom))}
  .drawer{width:100vw;top:auto;bottom:0;height:88vh;border-radius:16px 16px 0 0;transform:translateY(101%)}
  .drawer.on{transform:none}
  .modal{width:100vw;max-width:100vw;max-height:92vh;top:auto;bottom:0;left:0;transform:none;border-radius:16px 16px 0 0}
  /* iOS 会对 <16px 的输入框自动放大页面 —— 移动端输入类一律 16px */
  input,textarea,select,#kw{font-size:16px}
  textarea.ta{font-size:16px;line-height:1.55}
  .mini{min-height:44px;padding:0 15px}
  .src-card{padding:14px}
}

/* ---------- 数据源地图 / 取数路径 ---------- */
.src-grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(224px,1fr))}
.src-card{border:1px solid var(--line);border-radius:var(--r-s);padding:12px;background:var(--surface-2);cursor:pointer;transition:.15s;text-align:left;width:100%}
.src-card:hover{border-color:#C9C9CF;background:var(--surface)}
.src-card.on{border-color:var(--blue);background:#F2F7FE;box-shadow:0 0 0 1px var(--blue) inset}
.src-card .sh{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:500}
.src-card .sm{font-size:11.5px;color:var(--hint);margin-top:6px;line-height:1.65}
.badge{display:inline-flex;align-items:center;font-size:10.5px;padding:1.5px 6px;border-radius:5px;font-weight:500;white-space:nowrap}
.badge.ok{background:var(--down-soft);color:#14663A}
.badge.part{background:var(--amber-soft);color:#8A5A00}
.badge.no{background:var(--up-soft);color:#A52214}
.badge.man{background:var(--purple-soft);color:var(--purple)}
.mk-flow{display:flex;flex-direction:column;gap:1px}
.mk-r{display:grid;grid-template-columns:74px 58px 1fr;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line-2);font-size:12.5px}
.mk-r:last-child{border-bottom:0}
.mk-r .mn{font-weight:500}
.mk-r .mt{color:var(--sub);line-height:1.65}
.path{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;color:var(--sub);background:var(--surface-2);border:1px solid var(--line-2);border-radius:6px;padding:7px 9px;line-height:1.6;word-break:break-all}
.smap-tb{width:100%;border-collapse:collapse;font-size:12.5px}
.smap-tb th{text-align:left;font-weight:500;color:var(--hint);font-size:11.5px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.smap-tb td{padding:9px 10px;border-bottom:1px solid var(--line-2);vertical-align:top;line-height:1.65}
.smap-tb tr:last-child td{border-bottom:0}
.smap-wrap{overflow-x:auto}
.smap-tb{min-width:820px}

/* ---------- 覆盖度热力格 ---------- */
.cov-wrap{overflow-x:auto;padding:2px 0}
.cov{display:grid;gap:3px;min-width:520px;grid-template-columns:76px repeat(6,1fr)}
.cov .ch{font-size:11px;color:var(--hint);text-align:center;padding:4px 0}
.cov .rh{font-size:12px;color:var(--sub);display:flex;align-items:center;gap:5px;padding-right:6px}
.cov .cell{height:36px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500}
.cov .cell.z{background:repeating-linear-gradient(45deg,#F5F5F7 0 5px,#EFEFF2 5px 10px);color:#B0B0B6;font-weight:400;font-size:11px}
.cov .cell.l1{background:#EAF3FE;color:var(--blue-deep)}
.cov .cell.l2{background:#CFE4FB;color:var(--blue-deep)}
.cov .cell.l3{background:#0071E3;color:#fff}

/* ---------- 空态诊断 ---------- */
.diag{padding:0;overflow:hidden}
.diag-hd{padding:20px 20px 14px;border-bottom:1px solid var(--line)}
.diag-hd b{display:block;font-size:15px;font-weight:500;margin-bottom:5px}
.diag-hd span{font-size:12.5px;color:var(--sub);line-height:1.7}
.diag-b{padding:6px 0}
.diag-i{display:flex;gap:11px;padding:13px 20px;border-bottom:1px solid var(--line-2)}
.diag-i:last-child{border-bottom:0}
.diag-i .di{flex:none;width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center}
.diag-i .di.r{background:var(--up-soft);color:#A52214}
.diag-i .di.a{background:var(--amber-soft);color:#8A5A00}
.diag-i .di.b{background:var(--blue-soft);color:var(--blue-deep)}
.diag-i .db{flex:1;min-width:0}
.diag-i .dt{font-size:13px;font-weight:500;margin-bottom:4px}
.diag-i .dd{font-size:12.5px;color:var(--sub);line-height:1.7}
.diag-i .da{margin-top:9px;display:flex;gap:7px;flex-wrap:wrap}
.mini{min-height:32px;padding:0 12px;font-size:12.5px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--blue);font-weight:500}
.mini:hover{border-color:var(--blue)}
.srcb{font-size:10.5px;padding:1.5px 5px;border-radius:4px;margin-left:6px;font-weight:500;white-space:nowrap}
.srcb.auto{background:var(--down-soft);color:#14663A}
.srcb.half{background:var(--amber-soft);color:#8A5A00}
.srcb.manual{background:var(--purple-soft);color:var(--purple)}
.rule-warn{background:var(--amber-soft);border-radius:8px;padding:9px 11px;font-size:11.5px;color:#7A4E00;line-height:1.7;margin-top:2px}
.rule-warn b{color:#5C3A00;font-weight:500}
@media (max-width:860px){
  .cov{grid-template-columns:62px repeat(6,1fr);min-width:460px}
  .cov .cell{height:32px;font-size:11.5px}
  .src-grid{grid-template-columns:1fr}
  .mk-r{grid-template-columns:1fr;gap:5px;padding:12px 14px}
  .diag-i{padding:13px 15px}
  .diag-hd{padding:17px 15px 13px}
}

/* ---- v8：国家市场 / 品类细分树 / 成分库 ---- */
.chip-row2{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
.flt{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:0 10px;min-height:44px}
.flt>span{font-size:12.5px;color:var(--t2);white-space:nowrap}
.flt-sel{border:0;background:transparent;font-size:16px;color:var(--t1);font-family:inherit;padding:0;max-width:200px;-webkit-appearance:none;appearance:none;cursor:pointer}
.flt-sel:focus{outline:none}
.cmp-hd6{grid-template-columns:1.1fr .6fr .9fr .8fr .7fr 1.3fr}
.cmp-sub{color:var(--t2);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tab{border:1px solid var(--line);background:var(--card);color:var(--t2);font-family:inherit;font-size:14px;padding:0 16px;min-height:44px;border-radius:11px;cursor:pointer}
.tab.on{background:var(--t1);border-color:var(--t1);color:#fff;font-weight:600}
.ct-node{margin-top:6px}
.ct-node.lv2{margin-left:20px}
.ct-hd{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:0 12px;border:1px solid var(--line);background:var(--card);border-radius:11px;font-family:inherit;font-size:14.5px;color:var(--t1);cursor:pointer;text-align:left}

.ing-radar{margin:0 0 18px;padding:18px;border:1px solid #23395f;border-radius:16px;background:linear-gradient(145deg,#101d35,#0b1222);color:#f6f8fc}.ing-radar-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}.ing-radar-head h2{margin:0;font-size:20px}.ing-radar-head p{margin:4px 0 0;color:#9eacc2;font-size:12px}.ing-radar-pill{color:#5eead4;border:1px solid rgba(94,234,212,.3);border-radius:999px;padding:5px 9px;font-size:11px;white-space:nowrap}.ing-radar-push{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:14px}.ing-radar-card{min-height:132px;padding:13px;border:1px solid rgba(94,234,212,.23);border-radius:12px;background:rgba(20,39,61,.82);display:flex;flex-direction:column}.ing-radar-card h3{margin:0;font-size:15px}.ing-radar-card p{margin:7px 0;color:#d4e1ee;font-size:12px;line-height:1.5;flex:1}.ing-radar-meta{display:flex;gap:5px;flex-wrap:wrap}.ing-radar-meta span{font-size:10px;color:#9eacc2;background:rgba(255,255,255,.07);padding:3px 6px;border-radius:999px}.ing-radar-link{display:inline-block;margin-top:9px;color:#5eead4;font-size:11px}.ing-radar-tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.ing-radar-tabs button{border:1px solid #2a4168;background:#121f36;color:#9eacc2;border-radius:8px;padding:6px 11px;font:inherit;font-size:11px;cursor:pointer}.ing-radar-tabs button.on{background:#2b4774;color:#fff;border-color:#6b8fc8}.ing-radar-table{width:100%;border-collapse:collapse;font-size:12px}.ing-radar-table th,.ing-radar-table td{text-align:left;padding:9px 8px;border-bottom:1px solid rgba(148,163,184,.14)}.ing-radar-table th{color:#8d9db6;font-size:10px;font-weight:500}.ing-radar-table td{color:#dbe7f5}.ing-radar-table .muted{color:#9eacc2;font-size:10px}.ing-radar-table .up{color:#73e2a8;font-weight:600}.ing-radar-effect{color:#aebfd5;font-size:10px;line-height:1.35;margin-top:2px}.ing-radar-note{margin-top:10px;color:#8d9db6;font-size:10px}

/* ===== v10 · 视觉精修：把「工具」做成「有人替你盯着」的台面 ===== */

/* ---- 数字与标题的排版质感 ---- */
body{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.kpi .vl{font-size:24px;font-weight:600;letter-spacing:-.015em;margin-top:6px}
.sec-hd h2{letter-spacing:-.012em;font-weight:600}
.topbar-title h1{letter-spacing:-.015em;font-weight:600}
.card{box-shadow:var(--sh-1);transition:box-shadow .22s ease,transform .22s ease,border-color .22s ease}
.card:hover{box-shadow:var(--sh-2);border-color:#DFDFE6}
.card.kpi:hover{transform:translateY(-1px)}
.chip{transition:background .18s,border-color .18s,color .18s}
.chip:not(.on):hover{background:var(--surface-2);border-color:#D8D8E0}
.mini{transition:background .18s,border-color .18s,box-shadow .18s}
.mini:hover{box-shadow:var(--sh-1)}
.cmp-r{transition:background .16s}
.cmp-r:hover{background:var(--surface-2)}
.nav-item{transition:background .18s,color .18s}
.topbar{background:rgba(246,246,248,.76);backdrop-filter:saturate(190%) blur(22px);-webkit-backdrop-filter:saturate(190%) blur(22px)}
.topbar-title h1+p{max-width:52em}

/* ---------- 顶部多标签栏（浏览器式：侧边栏=入口，顶部=已开标签） ---------- */
.tabs{
  display:flex;align-items:flex-end;gap:4px;padding:10px 24px 0;
  overflow-x:auto;scrollbar-width:none;
}
.tabs::-webkit-scrollbar{display:none}
.tabs .tabs-add{
  flex:none;width:30px;height:30px;margin-bottom:2px;border-radius:8px;
  border:1px solid var(--line);background:var(--surface);color:var(--sub);
  display:flex;align-items:center;justify-content:center;cursor:pointer;
}
.tabs .tabs-add:hover{color:var(--blue);border-color:var(--blue)}
.tab{
  flex:none;display:flex;align-items:center;gap:7px;height:34px;padding:0 8px 0 12px;
  border:1px solid var(--line);border-bottom:0;border-radius:9px 9px 0 0;
  background:var(--surface);color:var(--sub);cursor:pointer;font-size:12.5px;
  position:relative;margin-bottom:-1px;white-space:nowrap;
}
.tab:hover{color:var(--text)}
.tab.on{
  background:var(--surface);color:var(--blue-deep);font-weight:500;
  border-color:#CFE4FB;box-shadow:0 -1px 0 var(--surface) inset;
}
.tab .ic{width:15px;height:15px}
.tab .tab-x{
  flex:none;width:18px;height:18px;border-radius:5px;border:0;background:transparent;
  color:var(--hint);cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:13px;line-height:1;padding:0;
}
.tab .tab-x:hover{background:var(--surface-2);color:var(--text)}
.tab .tab-x svg{width:11px;height:11px}

/* ---- 增速标注：中位数为主，均值被极端值拉高时如实标出 ---- */
.ins-row .vv .skew{font-size:10.5px;font-weight:400;color:var(--hint);margin-left:5px;
  padding:1px 5px;border-radius:5px;background:var(--surface-2);border:1px solid var(--line-2)}

/* ---- Hero 情报卡：浅色页面里唯一的重色块，负责第一眼的情绪 ---- */
.hero{
  position:relative;overflow:hidden;isolation:isolate;
  margin-bottom:22px;padding:26px 28px 24px;border-radius:var(--r-xl);
  color:#fff;background:var(--grad-hero);box-shadow:var(--sh-3);
}
.hero::before{
  content:'';position:absolute;inset:0;z-index:-1;
  background:
    radial-gradient(56% 88% at 4% -12%,rgba(64,110,255,.66),rgba(64,110,255,0) 62%),
    radial-gradient(48% 78% at 98% 2%,rgba(146,78,255,.52),rgba(146,78,255,0) 60%),
    radial-gradient(40% 60% at 62% 118%,rgba(0,196,168,.28),rgba(0,196,168,0) 62%);
}
.hero::after{
  content:'';position:absolute;inset:0;z-index:-1;opacity:.5;
  background-image:linear-gradient(rgba(255,255,255,.055) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(255,255,255,.055) 1px,transparent 1px);
  background-size:40px 40px;
  -webkit-mask-image:radial-gradient(78% 82% at 74% 0%,#000,transparent 72%);
  mask-image:radial-gradient(78% 82% at 74% 0%,#000,transparent 72%);
}
.hero-in{display:flex;gap:28px;align-items:flex-end;flex-wrap:wrap}
.hero-l{flex:1 1 330px;min-width:0}
.hero-r{display:flex;gap:10px;flex:0 1 auto;flex-wrap:wrap}
.hero-eye{display:inline-flex;align-items:center;gap:8px;font-size:11px;font-weight:500;
  letter-spacing:.15em;text-transform:uppercase;color:rgba(255,255,255,.6)}
.hero-eye i{width:6px;height:6px;border-radius:50%;background:#5CE1A6;box-shadow:0 0 0 4px rgba(92,225,166,.14);animation:heroPulse 2.6s ease-in-out infinite}
@keyframes heroPulse{0%,100%{box-shadow:0 0 0 3px rgba(92,225,166,.16)}50%{box-shadow:0 0 0 7px rgba(92,225,166,.04)}}
.hero-h{margin:12px 0 0;font-size:23px;line-height:1.44;font-weight:500;letter-spacing:-.012em;max-width:26em}
.hero-h em{font-style:normal;font-weight:600;
  background:linear-gradient(94deg,#9DBAFF,#C9A9FF 58%,#FFD9A6);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.hero-p{margin:11px 0 0;font-size:12.5px;line-height:1.78;color:rgba(255,255,255,.66);max-width:40em}
.hero-p b{color:rgba(255,255,255,.92);font-weight:600}
.hero-foot{margin-top:9px;font-size:11.5px;color:rgba(255,255,255,.5)}
.hero-btns{display:flex;gap:9px;margin-top:18px;flex-wrap:wrap}
.hero-btn{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:0 17px;
  border-radius:11px;font-size:13px;font-weight:500;color:#fff;
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  transition:background .18s,border-color .18s,transform .18s}
.hero-btn:hover{background:rgba(255,255,255,.18)}
.hero-btn:active{transform:scale(.98)}
.hero-btn.pri{background:#fff;border-color:#fff;color:#101534;font-weight:600}
.hero-btn.pri:hover{background:#EDF1FF}
.hero-stat{flex:0 0 auto;min-width:116px;padding:14px 16px 13px;border-radius:16px;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.13);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.hero-stat .l{font-size:11px;color:rgba(255,255,255,.58);letter-spacing:.02em}
.hero-stat .v{margin-top:6px;font-size:30px;font-weight:600;line-height:1.1;letter-spacing:-.025em;
  color:#fff;text-shadow:0 2px 20px rgba(150,180,255,.45)}
.hero-stat .v small{font-size:12px;font-weight:400;margin-left:3px;color:rgba(255,255,255,.6)}
.hero-stat .f{margin-top:5px;font-size:11px;color:rgba(255,255,255,.42)}

/* ---- 进入动效：只在切换视图时播一次，筛选时不闪 ---- */
@keyframes riseIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes heroIn{from{opacity:0;transform:translateY(16px) scale(.986)}to{opacity:1;transform:none}}
#view.anim > .hero{animation:heroIn .62s cubic-bezier(.16,1,.3,1) both}
#view.anim > .sec{animation:riseIn .46s cubic-bezier(.16,1,.3,1) both}
#view.anim > .sec:nth-child(1){animation-delay:.03s}
#view.anim > .sec:nth-child(2){animation-delay:.07s}
#view.anim > .sec:nth-child(3){animation-delay:.11s}
#view.anim > .sec:nth-child(4){animation-delay:.15s}
#view.anim > .sec:nth-child(5){animation-delay:.19s}
#view.anim > .sec:nth-child(6){animation-delay:.23s}
#view.anim > .sec:nth-child(7){animation-delay:.27s}
#view.anim > .sec:nth-child(8){animation-delay:.3s}
#view.anim > .sec:nth-child(n+9){animation-delay:.33s}
@media (prefers-reduced-motion:reduce){
  #view.anim > .hero,#view.anim > .sec,.hero-eye i{animation:none!important}
  .card,.hero-btn{transition:none!important}
}

/* ---- 移动端 ---- */
@media (max-width:860px){
  .hero{padding:20px 18px 18px;border-radius:18px}
  .hero-h{font-size:19px;line-height:1.5}
  .hero-in{gap:16px}
  .hero-r{width:100%;gap:8px}
  .hero-stat{flex:1 1 0;min-width:0;padding:11px 12px 10px;border-radius:13px}
  .hero-stat .v{font-size:22px}
  .hero-stat .f{display:none}
  .hero-btns{gap:8px}
  .hero-btn{flex:1 1 45%}
  .ins-row .vv .skew{display:none}
}

/* ===== v11 · 全球看板 / 榜单中心 专项 ===== */

/* ---- 小屏筛选：不再依赖横向长条，改「筛选」按钮 + 底部抽屉 + 已选 chips。
   抽屉必须挂在 body 直下的 #fltLayer：topbar 带 backdrop-filter，会把它内部
   position:fixed 子元素的包含块劫持到 topbar 自身，抽屉会被页面内容盖住。
   注意：本页变量是 --surface / --text / --sub，没有 --card / --t1 / --t2。 ---- */
.flt-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 0 2px}
.flt-open,.flt-sel-chips{display:none}
.flt-open{align-items:center;gap:7px;min-height:44px;padding:0 15px;border-radius:12px;
  border:1px solid var(--line);background:var(--surface);font-family:inherit;font-size:14px;
  font-weight:500;color:var(--text);cursor:pointer}
.flt-open .ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
.flt-open .n{display:inline-flex;align-items:center;justify-content:center;min-width:19px;height:19px;
  padding:0 5px;border-radius:10px;background:var(--blue);color:#fff;font-size:11px;font-weight:600}
.flt-sc{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 8px 0 11px;
  border-radius:9px;background:var(--blue-soft);color:var(--blue-deep);border:1px solid #CFE4FB;font-size:12px}
.flt-sc b{font-weight:500}
.flt-sc button{border:0;background:transparent;padding:0 2px;font-size:15px;line-height:1;
  color:inherit;cursor:pointer;font-family:inherit}
#fltLayer{display:none}
body.flt-lock{overflow:hidden}
@media (max-width:860px){
  .chips{overflow:visible;padding:0}
  .chips-wide{display:none}
  .flt-bar{padding:9px 0 11px}
  .flt-open{display:inline-flex}
  .flt-sel-chips{display:flex;flex-wrap:wrap;gap:6px;width:100%}
  /* 抽屉层：body 直下、fixed 全屏、z 高于 topbar(20)/side(30)/tabbar(35)/mask(40)，低于 toast(70) */
  #fltLayer.on{display:block;position:fixed;inset:0;z-index:60}
  .flt-scrim{position:absolute;inset:0;background:rgba(15,17,28,.46)}
  .flt-sheet{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;
    max-height:min(78vh,600px);background:var(--surface);border-radius:20px 20px 0 0;
    box-shadow:0 -18px 50px -20px rgba(10,16,48,.45);overflow:hidden;
    transform:translateY(102%);transition:transform .26s cubic-bezier(.32,.72,0,1)}
  .flt-sheet.on{transform:none}
  .flt-shd{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:14px 16px 12px;border-bottom:1px solid var(--line-2);font-size:14.5px;color:var(--text)}
  .flt-shd b{font-weight:600}
  .flt-shd .flt-shd-n{display:block;font-size:11.5px;color:var(--hint);margin-top:2px;font-weight:400}
  .flt-sbd{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding:14px 16px calc(20px + env(safe-area-inset-bottom))}
  .flt-row{margin-bottom:16px}
  .flt-lb{display:block;font-size:11.5px;color:var(--hint);margin-bottom:7px}
  .flt-set{display:flex;flex-wrap:wrap;gap:7px}
  .flt-row .flt{width:100%}
  .flt-row .flt+.flt{margin-top:10px}
  /* v11 触控目标 ≥ 44px（抽屉里的 chip / 排序 tab / 商品名 / 筛选按钮） */
  .rank-tab,.flt-sheet .chip{min-height:44px;height:44px;display:inline-flex;align-items:center;
    justify-content:center;border-radius:12px;font-size:13.5px;padding:0 14px}
  .flt-sheet .mini{min-height:44px;height:44px;display:inline-flex;align-items:center;padding:0 18px}
  .flt-sheet .flt-sel{min-height:44px;height:44px;font-size:16px;padding:0 10px}
  .flt-open{height:44px}
  .flt-sc{min-height:44px}
  .flt-sc button{min-width:34px;min-height:44px}
  .rkt .pname{min-height:44px;display:flex;align-items:center}
  /* 来源榜标题区：390px 下「『抖音罗盘』榜」不能被右栏挤成三行。
     标题独占首行且整词不折，说明与「共 N 条」在次行自然换行、数量右对齐。
     仅作用于榜单（.rank-sec），不影响其它视图的 .sec-hd。 */
  .rank-sec .sec-hd{display:flex;flex-wrap:wrap;align-items:baseline;gap:3px 8px}
  .rank-sec .sec-hd h2{flex:0 0 100%;min-width:0;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis}
  .rank-sec .sec-hd span:not(.r){flex:1 1 auto;min-width:0;line-height:1.55}
  .rank-sec .sec-hd .r{flex:0 0 auto;margin-left:auto;white-space:nowrap}
}
@media (min-width:861px){ #fltLayer{display:none !important} }

/* ---- 热力图：国家/地区 × 二级类目，容器内滚动，不产生页面级横向溢出 ---- */
.heat-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;padding:2px 0 6px}
.heat{display:grid;gap:4px;min-width:max-content}
.heat .hc,.heat .hr{font-size:11.5px;color:var(--hint)}
.heat .hr{position:sticky;left:0;z-index:2;background:var(--surface);display:flex;align-items:center;
  gap:5px;padding-right:10px;min-height:58px}
.heat .hc{writing-mode:vertical-rl;transform:rotate(180deg);height:112px;display:flex;
  align-items:center;justify-content:center;letter-spacing:.03em}
.heat .hcell{width:74px;min-height:58px;border-radius:9px;padding:7px 6px;display:flex;
  flex-direction:column;justify-content:center;gap:3px;border:1px solid transparent;
  font-family:inherit;cursor:pointer;text-align:left;transition:transform .18s,box-shadow .18s}
.heat .hcell b{font-size:14px;font-weight:600;line-height:1.05;letter-spacing:-.02em}
.heat .hcell i{font-size:10.5px;font-style:normal;color:var(--hint)}
.heat .hcell.z{background:repeating-linear-gradient(45deg,#F5F5F7 0 5px,#EFEFF2 5px 10px);
  cursor:default;align-items:center;color:#B0B0B6;font-size:11px}
.heat .hcell.l0{background:#F5F5F7;border-color:#E7E7EC}
.heat .hcell.l1{background:#F2F8FE;border-color:#E1EEFB}
.heat .hcell.l2{background:#DCEBFB;border-color:#C8DFF8}
.heat .hcell.l3{background:#0071E3;border-color:#0071E3}
.heat .hcell.l3 b{color:#fff}
.heat .hcell.l3 i{color:rgba(255,255,255,.78)}
.heat .hcell:not(.z):hover{transform:translateY(-1px);box-shadow:var(--sh-2)}

/* ---- 榜单表格：桌面是表，小屏自动变卡片 ---- */
.rkt-wrap{overflow-x:auto}
.rkt{width:100%;border-collapse:collapse}
.rkt th{font-size:11.5px;font-weight:500;color:var(--hint);text-align:left;padding:0 10px 9px;
  border-bottom:1px solid var(--line);white-space:nowrap}
.rkt td{padding:11px 10px;border-bottom:1px solid var(--line-2);font-size:12.5px;
  vertical-align:top;color:var(--text)}
.rkt tr:last-child td{border-bottom:0}
.rkt .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.rkt .rkno{width:46px;color:var(--hint);font-weight:500}
.rkt .rkno.top{color:var(--blue);font-size:14px}
.rkt .pname{font-size:13px;font-weight:500;line-height:1.42;white-space:normal;text-align:left}
.rkt .pmeta{font-size:11px;color:var(--hint);margin-top:4px;line-height:1.5}
.rkt .bdg{display:inline-block;margin-left:6px;font-size:10px;font-weight:400;
  color:var(--amber);background:var(--amber-soft);border-radius:6px;padding:1px 6px}
/* 低基数行：打标 + 置底，视觉上再压一档，避免 57725% 这种数字抢眼光 */
.rkt tr.ex td{color:var(--sub)}

   设限只会让规则永远打不中），改为展示用的「达人渗透度」参考。 */
var WIN_MIN_GROWTH = 60;
/* 新增的四条规则的门槛，集中放这里，改口径只动这一处 */
var NEW_MAX_DAYS = 90;        /* 新品机会：上市多少天内算新 */
var NEW_MIN_GROWTH = 100;     /* 新品机会：环比增速门槛 */
var NEW_MIN_SOLD = 1000;      /* 新品机会：销量门槛（没有销量数据时不卡） */
var MKT_MIN_SAMPLE = 20;      /* 市场机会：同一可比单元至少 20 条 */
var MKT_MIN_GROWTH = 20;      /* 稳健增长中枢（中位数） */
var MKT_MIN_POS = 60;         /* 正增长占比 */
var MKT_MIN_TOP50 = 40;       /* Top50 可识别覆盖率 */
var MKT_MIN_GROW_N = 3;       /* 至少 3 个正增长商品 */
var MKT_MIN_COMPLETE = 80;    /* 核心字段完整率 */
var GCAT_MIN_SAMPLE = 20;     /* 增速品类：同一可比单元至少 20 条 */
var GCAT_MIN_GROWTH = 20;     /* 增速品类：中位增速门槛 */
var ING_MIN_SAMPLE = 3;       /* 成分机会：成分至少出现在几个商品 */
var ING_MIN_GROWTH = 80;      /* 成分机会：这些商品的中位增速门槛 */

/* 洞察规则：从数据里提炼四类机会 */
function insightsOf(list) {
  var win = [], fix = [], blank = [], ready = [], risk = [], mkt = [], gcat = [], newp = [], ingr = [];
  for (var i = 0; i < list.length; i++) {
    var r = list[i];
    var g = numField(r, '环比增速'), k = numField(r, '关联达人数');
    var sd = numField(r, '销量');
    var bad = txtOf(r, '差评关键词');
    var overlap = txtOf(r, '与我方 SKU 重合度');
    var filing = txtOf(r, '备案路径'), hard = txtOf(r, '宣称支撑难度');
    var ratio = ratioCost(r);
    if (g !== null && g >= WIN_MIN_GROWTH) win.push(r);
    if (bad !== '') fix.push(r);
    if (overlap === '全新' && g !== null && g >= 25) blank.push(r);
    if (filing === '普通化妆品备案' && hard === '无需评价' && ratio !== null && ratio <= 0.25) ready.push(r);
    if ((g !== null && g < 0) || HIGH_RISK_WORD.test(bad)) risk.push(r);
    /* 新品机会：上市 90 天内且已经在起量，说明这个方向刚被市场验证过 */
    var d = daysSince(r['上市日期']);
    if (d !== null && d <= NEW_MAX_DAYS && g !== null && g >= NEW_MIN_GROWTH && (sd === null || sd >= NEW_MIN_SOLD)) newp.push(r);
  }
  /* 市场机会：国家/地区 × 二级类目 的格子，样本够且平均在涨 */
  var cells = {}, j;
  for (j = 0; j < list.length; j++) {
    var rj = list[j], ct = txtOf(rj, '国家/地区'), c2 = txtOf(rj, '二级类目');
    if (!ct || !c2) continue;
    var gv = numField(rj, '环比增速');
    if (gv === null) continue;
    var key = ct + '\u0001' + c2;
    if (!cells[key]) cells[key] = { country: ct, c2: c2, n: 0, gs: [], rows: [] };
    cells[key].n++; cells[key].gs.push(gv);
    cells[key].rows.push(rj);
  }
  var ck;
  for (ck in cells) {
    if (!Object.prototype.hasOwnProperty.call(cells, ck)) continue;
    var cl = cells[ck], cg = avgArr(cl.gs);
    if (cl.n >= MKT_MIN_SAMPLE && cg !== null && cg >= MKT_MIN_GROWTH) {
      mkt.push({ country: cl.country, c2: cl.c2, n: cl.n, avgGrowth: cg, rows: cl.rows, key: ck });
    }
  }
  mkt.sort(function (a, b) { return b.avgGrowth - a.avgGrowth; });

  /* 增速品类：二级类目聚合，涨 + 还没被达人铺开 = 值得切 */
  var c2s = c2Stats(list);
  for (j = 0; j < c2s.length; j++) {
    var x = c2s[j];
    if (x.n >= GCAT_MIN_SAMPLE && x.avgGrowth !== null && x.avgGrowth >= GCAT_MIN_GROWTH) gcat.push(x);
  }
  gcat.sort(function (a, b) { return b.avgGrowth - a.avgGrowth; });

  /* 成分机会：成分被多个在涨的商品写进标题 = 这个成分在带增长 */
  var ings = ingStats(list);
  for (j = 0; j < ings.length; j++) {
    var y = ings[j];
    if (y.n >= ING_MIN_SAMPLE && y.medianGrowth !== null && y.medianGrowth >= ING_MIN_GROWTH) ingr.push(y);
  }
  ingr.sort(function (a, b) { return b.medianGrowth - a.medianGrowth || b.n - a.n; });

  function byGrowth(a, b) { return (numField(b, '环比增速') || 0) - (numField(a, '环比增速') || 0); }
  win.sort(byGrowth); blank.sort(byGrowth); ready.sort(byGrowth); newp.sort(byGrowth);
  fix.sort(function (a, b) { return (numField(b, '销量') || 0) - (numField(a, '销量') || 0); });
  risk.sort(function (a, b) { return (numField(b, '销量') || 0) - (numField(a, '销量') || 0); });
  return { win: win, fix: fix, blank: blank, ready: ready, risk: risk,
    mkt: mkt, gcat: gcat, newp: newp, ingr: ingr };
}

/* ---------- 7b. 引擎体检：诊断「为什么算不出结果」 ----------
   洞察规则要能算出来，前提是它依赖的字段在数据里真实存在。
   依赖「人工标」字段的规则，导入数据后永远命中 0——这不是「没机会」，
   是「还没标」。必须把这两件事分开告诉用户，否则引擎等于空转。 ---------- */
var RULES_NEED = {
  win: { name: '窗口期', need: ['环比增速'] },
  fix: { name: '改良机会', need: ['差评关键词'] },
  blank: { name: '空白赛道', need: ['与我方 SKU 重合度', '环比增速'] },
  ready: { name: '可落地', need: ['备案路径', '宣称支撑难度', '预估成本', '价格'] },
  risk: { name: '风险提醒', need: ['环比增速', '差评关键词'] },
  mkt: { name: '市场机会', need: ['国家/地区', '二级类目', '环比增速'] },
  gcat: { name: '增速品类', need: ['二级类目', '环比增速'] },
  newp: { name: '新品机会', need: ['上市日期', '环比增速'] },
  ingr: { name: '成分机会', need: ['核心功效成分', '环比增速'] }

function hasField(r, name) {
  var fd = fieldDef(name);
  if (!fd) return false;
  if (fd.t === 'number') return numField(r, name) !== null;
  return txtOf(r, name) !== '';
}
/* 规则健康度：有多少条数据具备这条规则的全部前提；缺哪些字段 */
function ruleHealth(list, key) {
  var need = RULES_NEED[key].need, miss = [], i, j;
  for (j = 0; j < need.length; j++) miss.push({ f: need[j], ok: 0, total: list.length });
  var full = 0;
  for (i = 0; i < list.length; i++) {
    var all = true;
    for (j = 0; j < need.length; j++) {
      if (hasField(list[i], need[j])) miss[j].ok++;
      else all = false;
    }
    if (all) full++;
  }
  var lacking = [];
  for (j = 0; j < miss.length; j++) if (miss[j].ok === 0) lacking.push(miss[j].f);
  var partial = [];
  for (j = 0; j < miss.length; j++) if (miss[j].ok > 0 && miss[j].ok < miss[j].total) partial.push(miss[j].f + '（' + miss[j].ok + '/' + miss[j].total + '）');
  return { full: full, lacking: lacking, partial: partial, need: need };
}
/* 人工字段缺口总览：哪些字段全表为 0，且平台拿不到 */
function manualGaps(list) {
  var out = [];
  for (var i = 0; i < FIELDS.length; i++) {
    var f = FIELDS[i];
    if (f.src !== 'manual') continue;
    var n = 0;
    for (var j = 0; j < list.length; j++) if (hasField(list[j], f.n)) n++;
    if (n === 0) out.push(f.n);
  }
  return out;
}
/* 某个规则下，哪些市场一条都参与不了（字段天然缺位，比如韩国的销量）
   把「有个市场在这条规则里根本不出声」直接点出来，比只给比例有用。 */
function ruleSkippedMarkets(list, key) {
  var need = RULES_NEED[key].need, mkTot = {}, mkOk = {}, i, j;
  for (i = 0; i < list.length; i++) {
    var m = txtOf(list[i], '所属市场') || '未标市场';
    mkTot[m] = (mkTot[m] || 0) + 1;
    var all = true;
    for (j = 0; j < need.length; j++) if (!hasField(list[i], need[j])) { all = false; break; }
    if (all) mkOk[m] = (mkOk[m] || 0) + 1;
  }
  var out = [];
  for (var k in mkTot) {

    if (!mkOk[k]) out.push(k + ' ' + mkTot[k] + ' 条');
  }

}
/* 数据覆盖度：市场 × 品类 的条数矩阵。0 格就是盲区，本身就是结论 */
function coverageOf(list) {
  var mks = optionsFor('所属市场').map(function (o) { return o.text; });
  var cats = optionsFor('品类').map(function (o) { return o.text; });
  var grid = {}, i, j;
  for (i = 0; i < mks.length; i++) { grid[mks[i]] = {}; for (j = 0; j < cats.length; j++) grid[mks[i]][cats[j]] = 0; }
  var unmk = 0;
  for (i = 0; i < list.length; i++) {
    var m = txtOf(list[i], '所属市场'), c = txtOf(list[i], '品类');
    if (!m || !grid[m]) { unmk++; continue; }
    if (!c || grid[m][c] === undefined) continue;
    grid[m][c]++;

  var blank = [];
  for (i = 0; i < mks.length; i++) for (j = 0; j < cats.length; j++) if (!grid[mks[i]][cats[j]]) blank.push(mks[i] + ' · ' + cats[j]);
  return { mks: mks, cats: cats, grid: grid, blank: blank, unmk: unmk, total: list.length };
}
/* 关键词在哪：用户筛了 A 品类但关键词其实命中 B 品类，或哪个市场有货 */
function kwWhere(kw) {
  if (!kw) return null;
  var k = String(kw).toLowerCase();
  var byCat = {}, byMk = {}, sample = [];
  for (var i = 0; i < state.list.length; i++) {
    var r = state.list[i];
    if (isDemoFilteredOut(r)) continue;
    var hay = [txtOf(r, '商品名称'), txtOf(r, '细分品类'), txtOf(r, '概念标签'), txtOf(r, '功效宣称'), txtOf(r, '核心功效成分'), txtOf(r, '质地描述')].join(' ').toLowerCase();
    if (!matchesSearchHay(hay, k)) continue;
    var c = txtOf(r, '品类') || '未分类', m = txtOf(r, '所属市场') || '未标市场';
    byCat[c] = (byCat[c] || 0) + 1;
    byMk[m] = (byMk[m] || 0) + 1;

/* 示例/真实开关造成的过滤（覆盖度估算与列表过滤共用同一口径） */
function isDemoFilteredOut(r) { return (state.demoOnly && !isDemo(r)) || (state.realOnly && isDemo(r)); }

  for (cut = 1; cut <= 3 && cut < kw.length; cut++) tries.push(kw.slice(0, kw.length - cut));

    if (w) return { term: tries[i], n: w.n, byMk: w.byMk, byCat: w.byCat, sample: w.sample };
  }

/* ---------- 8. 渲染层（上层统一入口驱动，渲染函数之间互不调用） ---------- */
var RENDER = {};

/* ---- 内联 SVG 图表（手写，零依赖） ---- */
var MKT_COLOR = { '中国': '#0071E3', '韩国': '#D4537E', '日本': '#0E7C6B', '欧美': '#6E4BD1', '东南亚': '#B26A00' };
function mktColor(m) { return MKT_COLOR[m] || '#8E8E93'; }

function hbarSvg(items, opt) {
  opt = opt || {};
  var labelW = opt.labelW || 128, valW = opt.valW || 74;
  var W = 620, rowH = opt.rowH || 30;
  var barX = labelW + 8, barW = W - barX - valW;
  var max = 0;
  for (var i = 0; i < items.length; i++) { var v = Math.abs(items[i].v || 0); if (v > max) max = v; }
  if (max <= 0) max = 1;
  var H = items.length * rowH + 8;

  for (var j = 0; j < items.length; j++) {
    var it = items[j], y = j * rowH + 4;
    var w = Math.max(2, barW * (Math.abs(it.v || 0) / max));
    var col = it.color || opt.color || '#0071E3';
    s += '<text x="0" y="' + (y + 15) + '" font-size="12" fill="#6E6E73">' + esc(it.k) + '</text>';
    s += '<rect x="' + barX + '" y="' + (y + 5) + '" width="' + barW + '" height="10" rx="5" fill="#F0F0F3"/>';
    s += '<rect x="' + barX + '" y="' + (y + 5) + '" width="' + w.toFixed(1) + '" height="10" rx="5" fill="' + col + '"/>';
    s += '<text x="' + W + '" y="' + (y + 15) + '" font-size="12" fill="#1D1D1F" text-anchor="end">' + esc(it.t) + '</text>';

/* 增长动能 × 竞争密度散点：左上角即「窗口期」 */
function scatterSvg(list) {
  var pts = [], maxKol = 1, gMin = 1e9, gMax = -1e9, maxSales = 1;
  for (var i = 0; i < list.length; i++) {
    var r = list[i];
    var g = numField(r, '环比增速'), k = numField(r, '关联达人数');
    if (g === null || k === null) continue;
    var s = numField(r, '销售额'); if (s === null) s = 0;
    if (k > maxKol) maxKol = k;
    if (g < gMin) gMin = g;
    if (g > gMax) gMax = g;
    if (s > maxSales) maxSales = s;
    pts.push({ g: g, k: k, s: s, m: txtOf(r, '所属市场'), n: txtOf(r, '商品名称') });
  }
  if (!pts.length) return '<div class="empty">当前筛选下没有可绘制的同时含「增速 + 达人数」的商品</div>';
  if (gMax === gMin) { gMax = gMin + 1; }
  var W = 620, H = 300, x0 = 52, x1 = 606, y0 = 22, y1 = 252;
  var sq = Math.sqrt(maxKol) || 1;
  function px(k) { return x0 + (Math.sqrt(k) / sq) * (x1 - x0); }
  function py(g) { return y1 - ((g - gMin) / (gMax - gMin)) * (y1 - y0); }
  var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" role="img" style="display:block">';
  s += '<rect x="' + x0 + '" y="' + y0 + '" width="' + (x1 - x0) + '" height="' + (y1 - y0) + '" fill="#FAFAFC" rx="6"/>';
  s += '<rect x="' + x0 + '" y="' + y0 + '" width="' + ((x1 - x0) * 0.45) + '" height="' + ((y1 - y0) * 0.45) + '" fill="#EAF3FE" rx="6"/>';
  s += '<text x="' + (x0 + 9) + '" y="' + (y0 + 17) + '" font-size="11.5" fill="#0058B0">窗口期：达人少 · 增速高</text>';
  var ticks = 4;
  for (var t = 0; t <= ticks; t++) {
    var gy = y1 - (t / ticks) * (y1 - y0);
    var gv = Math.round(gMin + (t / ticks) * (gMax - gMin));
    s += '<line x1="' + x0 + '" y1="' + gy.toFixed(1) + '" x2="' + x1 + '" y2="' + gy.toFixed(1) + '" stroke="#E6E6EA" stroke-width="0.5"/>';
    s += '<text x="' + (x0 - 8) + '" y="' + (gy + 4).toFixed(1) + '" font-size="11" fill="#8E8E93" text-anchor="end">' + gv + '%</text>';
  }
  s += '<text x="' + x0 + '" y="' + (y1 + 20) + '" font-size="11" fill="#8E8E93">0</text>';
  s += '<text x="' + x1 + '" y="' + (y1 + 20) + '" font-size="11" fill="#8E8E93" text-anchor="end">' + maxKol + ' 个达人</text>';
  s += '<text x="' + ((x0 + x1) / 2) + '" y="' + (y1 + 20) + '" font-size="11" fill="#8E8E93" text-anchor="middle">关联达人数（越左越不挤）</text>';
  for (var j = 0; j < pts.length; j++) {
    var p = pts[j];

    s += '<circle cx="' + px(p.k).toFixed(1) + '" cy="' + py(p.g).toFixed(1) + '" r="' + rr.toFixed(1)
      + '" fill="' + mktColor(p.m) + '" fill-opacity="0.5" stroke="' + mktColor(p.m) + '" stroke-width="1"><title>'
      + esc(p.n) + '｜' + esc(p.m) + '｜增速 ' + p.g + '%｜达人 ' + p.k + '</title></circle>';
  }

  s += '</svg>';

/* =============================================================
   v11 · 全球看板 / 榜单中心 专项引擎
   ① 统一稳健增长口径（中位数，剔除低基数）
   ② 逐来源统计周期与数据截至（不合并、不编造）
   ③ 来源列可得性 + 国家×二级类目热力格 + 可比样本 GMV
   ============================================================= */

/* ---- ① 稳健增长口径：分组资格、排序、Hero、卡片、表格统一用这一套 ----
   为什么必须统一：算术均值会被「低基数新品」单点拉爆——真实数据里印尼 × 唇妆
   有一条环比 +57725%（当期销量 2313、反推基期只剩 4 件），一条就把整格均值从
   14% 抬到 8272.78%，而中位数只有 18.16%。所以：
     · 资格判定 / 排序 / 展示 一律用中位数（剔除低基数样本）
     · 同时给出样本量、正增长占比，并把「含极端值的中位数」对照展示，不藏
     · 剔除只影响「资格判定与排序」，样本本身照常展示，只是打标，不隐藏数据
   低基数判据：反推基期销量 = 当期销量 /（1 + 环比/100） < 10 件。
   新品（上市 ≤ 90 天）只标注不剔除，因为它是真实在卖的商品。 ---------- */
var GROW_BASE_MIN = 10;
var GROW_NEW_DAYS = 90;
function baseSoldOf(r) {
  var s = numField(r, '销量'), g = numField(r, '环比增速');
  if (s === null || g === null || g <= -100) return null;
  return s / (1 + g / 100);
}
function growExcluded(r) {
  var g = numField(r, '环比增速');
  if (g === null) return '无增速';
  var b = baseSoldOf(r);
  if (b !== null && b < GROW_BASE_MIN) return '低基数';
  return '';
}
function isNewProd(r) { var d = daysSince(r['上市日期']); return d !== null && d <= GROW_NEW_DAYS; }
function growthStats(rows) {
  var all = [], keep = [], exWhy = {}, exRows = [], i, j;
  rows = rows || [];
  for (i = 0; i < rows.length; i++) {
    var g = numField(rows[i], '环比增速');
    if (g === null) continue;
    all.push(g);
    var why = growExcluded(rows[i]);
    if (why) { exWhy[why] = (exWhy[why] || 0) + 1; exRows.push(rows[i]); }
    else keep.push(g);
  }
  var pos = 0;
  for (j = 0; j < keep.length; j++) if (keep[j] > 0) pos++;
  var whyList = [];
  for (var k in exWhy) if (Object.prototype.hasOwnProperty.call(exWhy, k)) whyList.push(k + ' ' + exWhy[k] + ' 条');
  return {

/* 数字滚动：只在首次渲染和切换视图时跑，尊重「减少动态效果」偏好 */
function animateCounters() {
  var reduce = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  var els = $$('[data-count]');
  for (var i = 0; i < els.length; i++) {
    (function (el) {
      var target = parseFloat(el.getAttribute('data-count')) || 0;
      var unit = el.getAttribute('data-unit') || '';
      var paint = function (v) {
        el.innerHTML = v + (unit ? '<small>' + unit + '</small>' : '');
      };
      if (reduce || !window.requestAnimationFrame) { paint(target); return; }
      var t0 = 0, dur = 760;
      var step = function (ts) {
        if (!t0) t0 = ts;
        var p = Math.min(1, (ts - t0) / dur);
        var e = 1 - Math.pow(1 - p, 3);
        paint(Math.round(target * e));
        if (p < 1) window.requestAnimationFrame(step); else paint(target);
      };
      window.requestAnimationFrame(step);
    })(els[i]);
  }
}

    }

  }

RENDER.strategy = function () { var v=$('#view'); v.innerHTML=strategyHtml(); bindStrategyEvents(); };

function firstTag(v) {
  var a = splitTags(v);
  return a.length ? a[0] : String(v || '');
}

function insightHtml() {
  var list = dataOf();
  if (!list.length) {
    return diagHtml(list);
  }
  var ins = insightsOf(list);
  function avgOf(arr, name) { return avgField(arr, name); }
  /* 规则健康度：这条规则的前提字段在这批数据里齐不齐 */
  function warnFor(key) {
    var h = ruleHealth(list, key);
    if (!h.lacking.length) return '';
    var auto = [], man = [];
    for (var i = 0; i < h.lacking.length; i++) {
      var fd = fieldDef(h.lacking[i]);
      if (fd && fd.src === 'manual') man.push(h.lacking[i]); else auto.push(h.lacking[i]);
    }
    var s = '<b>这条规则现在算不出来：</b>全表缺「' + esc(h.lacking.join('、')) + '」。';
    if (man.length) s += '其中 ' + esc(man.join('、')) + ' 任何平台都导不出来，要在商品档案里人工标。';
    if (auto.length) s += '其中 ' + esc(auto.join('、')) + ' 平台能导，是这次导入的表里没有这一列。';
    return '<div class="rule-warn">' + s + '</div>';
  }
  function partWarn(key) {
    var h = ruleHealth(list, key);
    if (!h.partial.length || h.lacking.length) return '';
    return '<div class="rule-warn">部分数据没这个字段，已跳过：' + esc(h.partial.join('、')) + '</div>';
  }
  function rowsHtml(arr, mode, n) {
    var out = '', lim = Math.min(n || 4, arr.length);
    for (var i = 0; i < lim; i++) {
      var r = arr[i], mk = txtOf(r, '所属市场');
      var val = '';
      if (mode === 'growth') val = '<span class="' + pctCls(numField(r, '环比增速')) + '">' + fmtPct(numField(r, '环比增速')) + '</span> · 达人 ' + (numField(r, '关联达人数') === null ? '—' : numField(r, '关联达人数'));
      else if (mode === 'refund') val = '<span class="up">退货 ' + (numField(r, '退货率') === null ? '—' : numField(r, '退货率') + '%') + '</span> · 销量 ' + fmtBig(numField(r, '销量'));
      else if (mode === 'blank') val = '<span class="' + pctCls(numField(r, '环比增速')) + '">' + fmtPct(numField(r, '环比增速')) + '</span> · ' + esc(firstTag(txtOf(r, '概念标签')) || txtOf(r, '细分品类'));
      else if (mode === 'ready') { var k = ratioCost(r); val = '成本比 ' + (k === null ? '—' : Math.round(k * 100) + '%') + ' · ' + fmtMoney(numField(r, '价格')); }
      else val = fmtMoney(numField(r, '价格')) + ' · 销量 ' + fmtBig(numField(r, '销量'));
      out += '<button type="button" class="ins-row" data-open="' + esc(ridOf(r)) + '">'
        + '<span class="nm">' + esc(mk ? '[' + mk + '] ' : '') + esc(txtOf(r, '商品名称') || '未命名') + '</span>'
        + '<span class="vv">' + val + '</span></button>';
    }
    return out;
  }
  function card(o) {
    return '<div class="card ins"><div class="ins-hd">'
      + '<span class="ins-icon ' + (o.cls || '') + '"><svg class="ic" viewBox="0 0 24 24">' + o.icon + '</svg></span>'
      + '<span><span class="ins-t">' + esc(o.title) + '</span><span class="ins-d">' + esc(o.desc) + '</span></span>'
      + '</div><div class="ins-ev">' + o.ev + '</div>'
      + (o.rows ? '<div class="ins-list">' + o.rows + '</div>' : '')
      + (o.warn || '')
      + '<div class="hint">' + esc(o.rule) + '</div></div>';
  }
  var ICON = {
    search: '<path d="M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14z"/><path d="M20 20l-3.6-3.6"/>',
    tool: '<path d="M14.7 6.3a4 4 0 1 0 5 5L21 21H3l8.6-8.6"/>',
    compass: '<circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-1.8 5.2-5.2 1.8 1.8-5.2z"/>',
    check: '<path d="M20 6L9 17l-5-5"/>',
    warn: '<path d="M12 3l9 16H3z"/><path d="M12 9v5M12 17.5v.01"/>'
  };

  var h = '';
  /* 规则前提体检：先摊开「哪条规则的前提齐、哪条缺」，再给结论 */
  var health = [], key, hh;
  var order = ['win', 'fix', 'blank', 'ready', 'risk', 'mkt', 'gcat', 'newp', 'ingr'];
  for (var oi = 0; oi < order.length; oi++) {
    key = order[oi]; hh = ruleHealth(list, key);
    health.push({ key: key, name: RULES_NEED[key].name, ok: !hh.lacking.length, full: hh.full, lacking: hh.lacking, partial: hh.partial });
  }
  var blocked = 0;
  for (var bi = 0; bi < health.length; bi++) if (!health[bi].ok) blocked++;
  var ph = '<div class="card pad" style="margin-bottom:12px">'
    + '<div class="hint" style="margin-bottom:10px">引擎体检：' + order.length + ' 条规则里 <b>' + (order.length - blocked) + '</b> 条前提齐全、<b>' + blocked + '</b> 条缺字段算不出来。'
    + (blocked ? '缺字段的规则下面会单独提示，先补字段比反复调筛选有用。' : '下面每条结论都建立在本批数据上。') + '</div>';
  for (var hi = 0; hi < health.length; hi++) {
    var x = health[hi];
    var skip = ruleSkippedMarkets(list, x.key);
    ph += '<div class="mk-r" style="padding:9px 0;border-color:var(--line-2)">'
      + '<span class="mn" style="font-weight:500">' + esc(x.name) + '</span>'
      + '<span><span class="badge ' + (x.ok ? 'ok' : 'no') + '">' + (x.ok ? '可算' : '缺字段') + '</span></span>'
      + '<span class="mt">' + (x.ok ? '前提字段齐全，' + x.full + ' 条数据参与判定' + (x.partial.length ? '（部分条目缺 ' + esc(x.partial.join('、')) + '，已跳过）' : '') : '缺 ' + esc(x.lacking.join('、')))
      + (skip.length ? '<br><span style="color:#8A5A00">' + esc(skip.join('、')) + ' 在这条规则里一条都参与不了——这批数据缺它需要的字段</span>' : '')
      + '</span></div>';
  }
  ph += '</div>';
  h += ph;

  var wg = medGrowthOf(ins.win), wk = avgOf(ins.win, '关联达人数');
  var kLow = 0, kMid = 0, kHigh = 0, kNone = 0;
  for (var ki = 0; ki < ins.win.length; ki++) {
    var kv = numField(ins.win[ki], '关联达人数');
    if (kv === null) kNone++; else if (kv <= 50) kLow++; else if (kv <= 150) kMid++; else kHigh++;
  }
  h += card({
    cls: '', title: '窗口期商品', desc: '增速已经起来，达人还没铺开——现在介入成本最低',
    icon: ICON.search,
    ev: '命中 <b>' + ins.win.length + '</b> 个　·　增速中位 <b>' + (wg === null ? '—' : Math.round(wg) + '%') + '</b>　·　达人渗透度：未铺开 <b>' + kLow + '</b> / 起量 <b>' + kMid + '</b> / 已铺开 <b>' + kHigh + '</b>'
      + (kNone ? '（' + kNone + ' 条无达人数据）' : ''),
    rows: rowsHtml(ins.win, 'growth', 4),
    warn: warnFor('win') || partWarn('win'),
    rule: '规则：环比增速 ≥ ' + WIN_MIN_GROWTH + '%，达人数与销售额不设门槛。达人数只作「达人渗透度」参考——未铺开（≤50）说明还没被批量投放，介入成本最低；已铺开（>150）说明需求已被验证但竞争激烈。'
  });

  h += card({
    cls: 'r', title: '改良机会', desc: '需求已被榜单验证，差评指出了没做好的地方',
    icon: ICON.tool,
    ev: '命中 <b>' + ins.fix.length + '</b> 个　·　均有差评关键词　·　按销量排序',
    rows: rowsHtml(ins.fix, 'sales', 4),
    warn: warnFor('fix') || partWarn('fix'),
    rule: '规则：差评关键词非空即命中。门槛不再是退货率（三平台榜单都不给），而是真实评价里反复出现的抱怨——差评关键词不是缺点清单，是改良清单。'
  });

  h += card({
    cls: 'p', title: '空白赛道', desc: '与我方产品线不重合，且在增长',
    icon: ICON.compass,
    ev: '命中 <b>' + ins.blank.length + '</b> 个　·　增速中位 <b>' + (medGrowthOf(ins.blank) === null ? '—' : Math.round(medGrowthOf(ins.blank)) + '%') + '</b>',
    rows: rowsHtml(ins.blank, 'blank', 4),
    warn: warnFor('blank') || partWarn('blank'),
    rule: '规则：与我方 SKU 重合度 = 全新 且 环比增速 ≥ 25%。不重合才有增量，重合度高的品做得再好也只是内部替代。'
  });

  var ratioSum = 0, ratioN = 0;
  for (var i = 0; i < ins.ready.length; i++) { var rr = ratioCost(ins.ready[i]); if (rr !== null) { ratioSum += rr; ratioN++; } }
  h += card({
    cls: 'g', title: '可落地', desc: '备案最省事、成本空间最大，能做出来',
    icon: ICON.check,
    ev: '命中 <b>' + ins.ready.length + '</b> 个　·　平均成本比 <b>' + (ratioN ? Math.round(ratioSum / ratioN * 100) + '%' : '—') + '</b>',
    rows: rowsHtml(ins.ready, 'ready', 4),
    warn: warnFor('ready') || partWarn('ready'),
    rule: '规则：备案路径 = 普通化妆品备案 且 宣称支撑难度 = 无需评价 且 预估成本 ÷ 价格 ≤ 25%。这三条同时满足，从立项到上架是最短路径。'
  });

  if (ins.risk.length) {
    h += card({
      cls: 'r', title: '风险提醒', desc: '已在负增长，或差评里出现过敏、刺激这类硬伤',
      icon: ICON.warn,
      ev: '命中 <b>' + ins.risk.length + '</b> 个',
      rows: rowsHtml(ins.risk, 'risk', 4),
      warn: warnFor('risk') || partWarn('risk'),
      rule: '规则：环比增速 < 0 或 差评关键词含高危词（过敏/刺激/烂脸/闷痘…）。这类品不是不能做，而是必须先搞清楚负增长和差评的原因再决定。'
    });
  }

  /* ---- 市场机会：国家 × 二级类目 ---- */
  var mktRows = '';
  if (ins.mkt.length) {
    for (var mi = 0; mi < Math.min(5, ins.mkt.length); mi++) {
      var mx = ins.mkt[mi];
      /* 显示中位数：单条低基数新品（如环比 +57725%）能把均值拉爆，
         那样既不可信也不好读。均值偏离中位数 3 倍以上就如实标注。 */
      var mgv = medGrowthOf(mx.rows);
      if (mgv === null) mgv = mx.avgGrowth;
      var mskew = mx.avgGrowth > 0 && mgv > 0 && mx.avgGrowth > mgv * 3;
      mktRows += '<button type="button" class="ins-row" data-f="country" data-v="' + esc(mx.country) + '">'
        + '<span class="nm">[' + esc(mx.country) + '] ' + esc(mx.c2) + '　<small>' + mx.n + ' 个样本</small></span>'
        + '<span class="vv"><span class="' + pctCls(mgv) + '">' + fmtPct(mgv) + '</span>'
        + (mskew ? '<small class="skew">已剔除极端值</small>' : '') + '</span></button>';
    }
  }
  h += card({
    cls: 'p', title: '市场机会', desc: '某个国家的某个细分正在整体起量——去哪个国家做，比做什么更容易做错',
    icon: ICON.compass,
    ev: '命中 <b>' + ins.mkt.length + '</b> 个「国家 × 二级类目」格子'
      + (ins.mkt.length ? '　·　最高 <b>' + esc(ins.mkt[0].country) + ' · ' + esc(ins.mkt[0].c2) + '</b> ' + fmtPct(medGrowthOf(ins.mkt[0].rows)) : ''),
    rows: mktRows,
    warn: warnFor('mkt') || partWarn('mkt'),
    rule: '规则：同一个「国家/地区 × 二级类目」里至少 ' + MKT_MIN_SAMPLE + ' 个样本，且这些样本的平均环比增速 ≥ ' + MKT_MIN_GROWTH + '%。点一行就能把该国家筛出来。列表里显示的是中位数——个别低基数新品会把均值抬到几千个百分点，中位数更能代表这一格的常态水位。'
  });

  /* ---- 增速品类：赛道维度 ---- */
  var gcatRows = '';
  for (var gi = 0; gi < Math.min(5, ins.gcat.length); gi++) {
    var gx = ins.gcat[gi];
    var ggv = medGrowthOfC2(list, gx.c2);
    if (ggv === null) ggv = gx.avgGrowth;
    var gskew = gx.avgGrowth > 0 && ggv > 0 && gx.avgGrowth > ggv * 3;
    gcatRows += '<button type="button" class="ins-row" data-f="c2" data-v="' + esc(gx.c2) + '">'
      + '<span class="nm">' + esc(gx.l1) + ' · ' + esc(gx.c2) + '　<small>' + gx.n + ' 个 / ' + gx.c3n + ' 个三级类目</small></span>'
      + '<span class="vv"><span class="' + pctCls(ggv) + '">' + fmtPct(ggv) + '</span> · ' + fmtBig(gx.sales)
      + (gskew ? '<small class="skew">已剔除极端值</small>' : '') + '</span></button>';
  }
  h += card({
    cls: '', title: '增速品类', desc: '把商品汇总到赛道层看——单个品可能是运气，整个子类在涨才是趋势',
    icon: ICON.search,
    ev: '命中 <b>' + ins.gcat.length + '</b> 个二级类目　·　门槛：样本 ≥ ' + GCAT_MIN_SAMPLE + ' 且平均增速 ≥ ' + GCAT_MIN_GROWTH + '%',
    rows: gcatRows,
    warn: warnFor('gcat') || partWarn('gcat'),
    rule: '规则：二级类目（功能子类）内至少 ' + GCAT_MIN_SAMPLE + ' 个商品，且平均环比增速 ≥ ' + GCAT_MIN_GROWTH + '%。赛道层面的结论比单品稳，因为不受单个品的活动节奏影响。'
  });

  /* ---- 新品机会 ---- */
  var newRows = '';
  for (var ni = 0; ni < Math.min(5, ins.newp.length); ni++) {
    var nx = ins.newp[ni], nd = daysSince(nx['上市日期']);
    newRows += '<button type="button" class="ins-row" data-open="' + esc(ridOf(nx)) + '">'
      + '<span class="nm">' + esc(txtOf(nx, '国家/地区') || '') + ' ' + esc(txtOf(nx, '商品名称') || '未命名') + '</span>'
      + '<span class="vv"><span class="' + pctCls(numField(nx, '环比增速')) + '">' + fmtPct(numField(nx, '环比增速')) + '</span> · 上架 ' + nd + ' 天</span></button>';
  }
  h += card({
    cls: 'g', title: '新品机会', desc: '上市不到 ' + NEW_MAX_DAYS + ' 天就涨起来的品——刚被市场验证，还没形成壁垒',
    icon: ICON.check,
    ev: '命中 <b>' + ins.newp.length + '</b> 个　·　门槛：上架 ≤ ' + NEW_MAX_DAYS + ' 天、增速 ≥ ' + NEW_MIN_GROWTH + '%'
      + (ins.newp.length ? '　·　最新 <b>' + daysSince(ins.newp[0]['上市日期']) + ' 天</b>' : ''),

function openModal(title, body, foot) {

  $('#modal').innerHTML = '<div class="md-hd"><h3>' + esc(title) + '</h3>'
    + '<button type="button" class="icon-btn" data-close="1" aria-label="关闭">'
