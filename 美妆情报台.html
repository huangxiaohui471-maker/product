<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>美妆情报台</title>
<!-- 本工作台通过 WorkBuddy「资料库」skill 搭建、存储和部署 -->
<style>
:root{
  --bg:#f5f5f7; --panel:#ffffff; --panel2:#fbfbfd;
  --line:#e5e5ea; --line2:#efeff2;
  --text:#1d1d1f; --text2:#6e6e73; --text3:#9a9aa0;
  --blue:#0071e3; --blue-soft:#eaf3fe; --blue-line:#c9e0fb;
  --red:#d70015; --red-soft:#fdeced;
  --green:#1d8a3a; --green-soft:#eaf7ee;
  --amber:#a35a00; --amber-soft:#fdf3e4;
  --purple:#6e56cf; --purple-soft:#f0edfc;
  --r:14px; --r2:10px;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.05);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",Roboto,sans-serif;
  background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--text)}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}
.hide{display:none !important}
svg{display:block}
.ico{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* ---------- shell ---------- */
#app{display:flex;min-height:100%;height:100%}
.sidebar{
  width:216px;flex:0 0 216px;background:var(--bg);border-right:1px solid var(--line);
  display:flex;flex-direction:column;padding:18px 12px 12px;position:sticky;top:0;height:100vh;
}
.brand{display:flex;align-items:center;gap:9px;padding:4px 8px 16px}
.brand-mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(145deg,#0071e3,#4aa8ff);
  display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,113,227,.28)}
.brand-mark svg{width:17px;height:17px;stroke:#fff}
.brand-name{font-size:15px;font-weight:600;letter-spacing:.2px}
.brand-sub{font-size:11px;color:var(--text3);margin-top:-2px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;
  font-size:14px;color:var(--text2);width:100%;text-align:left;transition:background .15s,color .15s;
}
.nav-item:hover{background:#ececf0;color:var(--text)}
.nav-item.on{background:#e6e6eb;color:var(--text);font-weight:600}
.nav-item.on .ico{stroke:var(--blue)}
.nav-label{flex:1}
.nav-count{font-size:11px;color:var(--text3);font-variant-numeric:tabular-nums;background:#fff;
  border:1px solid var(--line);border-radius:20px;padding:1px 7px;min-width:22px;text-align:center}
.nav-item.on .nav-count{background:#fff;border-color:#dcdce2}
.side-foot{margin-top:auto;padding:10px 8px 0;border-top:1px solid var(--line2);font-size:11px;color:var(--text3)}
.sync-row{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex:0 0 7px}
.sync-dot.off{background:var(--amber)}
.sync-dot.busy{background:var(--blue);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

.main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--panel)}
.topbar{
  position:sticky;top:0;z-index:20;background:rgba(255,255,255,.86);backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--line2);padding:0 22px;height:56px;display:flex;align-items:center;gap:12px;
}
.page-title{font-size:16px;font-weight:600;letter-spacing:.2px}
.page-desc{font-size:12px;color:var(--text3);margin-left:2px}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 13px;
  border-radius:9px;font-size:13px;background:#fff;border:1px solid var(--line);color:var(--text);
  transition:background .15s,border-color .15s;
}
.btn:hover{background:#f4f4f7}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{background:#0063c8}
.btn.sm{height:28px;padding:0 10px;font-size:12px;border-radius:7px}
.btn.ico-btn{width:34px;padding:0}
.btn:disabled{opacity:.5;cursor:not-allowed}

.scroll{flex:1;overflow-y:auto;padding:18px 22px calc(28px + env(safe-area-inset-bottom))}
.view{display:none}
.view.on{display:block}

/* ---------- today ---------- */
.today{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:18px;overflow:hidden}
.today-head{display:flex;align-items:center;gap:9px;padding:13px 16px;border-bottom:1px solid var(--line2);background:var(--panel2)}
.today-head h2{margin:0;font-size:14px;font-weight:600}
.today-date{font-size:12px;color:var(--text3);margin-left:auto;font-variant-numeric:tabular-nums}
.today-badge{font-size:11px;background:var(--red-soft);color:var(--red);border-radius:20px;padding:1px 8px;font-weight:600}
.today-list{padding:6px}
.today-row{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--r2);transition:background .15s}
.today-row:hover{background:#fafafc}
.today-row+.today-row{border-top:1px solid var(--line2)}
.today-flag{width:3px;height:26px;border-radius:3px;flex:0 0 3px;background:var(--blue)}
.today-flag.over{background:var(--red)}
.today-flag.soon{background:var(--amber)}
.today-main{flex:1;min-width:0}
.today-title{font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.today-meta{font-size:11.5px;color:var(--text3);margin-top:1px}
.today-meta b{color:var(--red);font-weight:600}
.today-empty{padding:20px 16px;text-align:center;color:var(--text3);font-size:13px}

/* ---------- common ---------- */
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.search{position:relative;flex:1;min-width:180px;max-width:340px}
.search input{width:100%;height:34px;padding:0 12px 0 32px;border:1px solid var(--line);border-radius:9px;background:#fff}
.search input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:15px;height:15px;stroke:var(--text3);fill:none;stroke-width:1.8}
.chip{
  height:31px;padding:0 11px;border-radius:20px;border:1px solid var(--line);background:#fff;
  font-size:12.5px;color:var(--text2);display:inline-flex;align-items:center;gap:5px;
}
.chip:hover{background:#f5f5f8}
.chip.on{background:var(--blue-soft);border-color:var(--blue-line);color:var(--blue);font-weight:600}
.chip select{border:0;background:transparent;font-size:12.5px;padding:0;height:29px;color:inherit;outline:none}
.sel{
  height:31px;padding:0 8px;border-radius:20px;border:1px solid var(--line);background:#fff;
  font-size:12.5px;color:var(--text2);outline:none;
}
.sel:focus{border-color:var(--blue)}
.sec-head{display:flex;align-items:center;gap:8px;margin:2px 0 12px}
.sec-head h2{margin:0;font-size:15px;font-weight:600}
.sec-head .sub{font-size:12px;color:var(--text3)}
.sec-head .right{margin-left:auto;display:flex;gap:8px;align-items:center}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.card{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;
  display:flex;flex-direction:column;gap:8px;transition:border-color .15s,box-shadow .15s;
}
.card:hover{border-color:#d5d5dc;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.card-top{display:flex;align-items:flex-start;gap:8px}
.card-title{font-size:14px;font-weight:600;line-height:1.45;flex:1;word-break:break-word}
.card-note{font-size:12.5px;color:var(--text2);line-height:1.6;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.card-foot{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:2px}
.card-acts{margin-left:auto;display:flex;gap:2px}
.mini{font-size:11.5px;padding:2px 7px;border-radius:6px;background:#f2f2f5;color:var(--text2);white-space:nowrap}
.mini.b{border-radius:20px}
.tag{font-size:11.5px;padding:2px 8px;border-radius:20px;white-space:nowrap;border:1px solid transparent}
.tag.gray{background:#f2f2f5;color:var(--text2);border-color:var(--line)}
.tag.blue{background:var(--blue-soft);color:var(--blue)}
.tag.red{background:var(--red-soft);color:var(--red)}
.tag.green{background:var(--green-soft);color:var(--green)}
.tag.amber{background:var(--amber-soft);color:var(--amber)}
.tag.purple{background:var(--purple-soft);color:var(--purple)}
.icon-btn{width:26px;height:26px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;color:var(--text3)}
.icon-btn:hover{background:#f0f0f3;color:var(--text)}
.icon-btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:40px 20px;text-align:center;color:var(--text3);font-size:13px;background:var(--panel2)}
.empty b{display:block;color:var(--text2);font-size:14px;margin-bottom:4px;font-weight:600}

/* board */
.board{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:12px;align-items:start}
.col{background:var(--panel2);border:1px solid var(--line2);border-radius:var(--r);padding:10px}
.col-head{display:flex;align-items:center;gap:7px;padding:2px 4px 9px;font-size:13px;font-weight:600}
.col-head .n{font-size:11px;color:var(--text3);background:#fff;border:1px solid var(--line);border-radius:20px;padding:0 7px;font-weight:500}
.col-body{display:flex;flex-direction:column;gap:9px;min-height:44px}
.tcard{background:#fff;border:1px solid var(--line);border-radius:var(--r2);padding:10px 11px;display:flex;flex-direction:column;gap:7px}
.tcard:hover{border-color:#d5d5dc}
.tcard-title{font-size:13.5px;font-weight:600;line-height:1.45;word-break:break-word}
.tcard-meta{font-size:11.5px;color:var(--text3);display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.col-add{width:100%;margin-top:8px;height:30px;border:1px dashed var(--line);border-radius:8px;color:var(--text3);font-size:12px;background:#fff}
.col-add:hover{border-color:var(--blue);color:var(--blue)}

/* kpi + chart */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 15px}
.kpi-l{font-size:12px;color:var(--text3);margin-bottom:5px}
.kpi-v{font-size:23px;font-weight:650;font-variant-numeric:tabular-nums;letter-spacing:-.4px}
.kpi-s{font-size:11.5px;color:var(--text3);margin-top:3px}
.panelbox{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:16px}
.panelbox h3{margin:0 0 3px;font-size:14px;font-weight:600}
.panelbox .h3s{font-size:12px;color:var(--text3);margin-bottom:14px}
.bars{display:flex;flex-direction:column;gap:9px}
.bar-row{display:flex;align-items:center;gap:10px}
.bar-name{width:64px;flex:0 0 64px;font-size:12.5px;color:var(--text2);text-align:right}
.bar-track{flex:1;height:22px;background:#f4f4f7;border-radius:6px;overflow:hidden}
.bar-fill{height:100%;border-radius:6px;background:linear-gradient(90deg,#4aa8ff,#0071e3);transition:width .45s ease}
.bar-val{width:74px;flex:0 0 74px;font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--text2)}

/* table */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:#fff}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:700px}
th,td{padding:10px 13px;text-align:left;border-bottom:1px solid var(--line2);white-space:nowrap}
th{font-size:12px;color:var(--text3);font-weight:600;background:var(--panel2)}
tbody tr:hover{background:#fafafc}
tbody tr:last-child td{border-bottom:0}
td.num{font-variant-numeric:tabular-nums;text-align:right}
td.wrap{white-space:normal;min-width:200px;max-width:340px}

/* list rows */
.rows{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:#fff}
.row{display:flex;align-items:center;gap:12px;padding:12px 15px;border-bottom:1px solid var(--line2)}
.row:last-child{border-bottom:0}
.row:hover{background:#fafafc}
.row-main{flex:1;min-width:0}
.row-title{font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.row-sub{font-size:12px;color:var(--text3);margin-top:3px;word-break:break-all}
.row-right{display:flex;align-items:center;gap:6px}

/* drawer */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.28);opacity:0;pointer-events:none;transition:opacity .22s;z-index:50}
.mask.on{opacity:1;pointer-events:auto}
.drawer{
  position:fixed;top:0;right:0;height:100%;width:420px;max-width:100%;background:#fff;z-index:51;
  transform:translateX(102%);transition:transform .26s cubic-bezier(.32,.72,0,1);
  display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(0,0,0,.12);
}
.drawer.on{transform:none}
.drawer-head{display:flex;align-items:center;gap:10px;padding:15px 18px;border-bottom:1px solid var(--line2)}
.drawer-head h3{margin:0;font-size:15px;font-weight:600}
.drawer-head .x{margin-left:auto}
.drawer-body{flex:1;overflow-y:auto;padding:16px 18px}
.drawer-foot{padding:13px 18px calc(13px + env(safe-area-inset-bottom));border-top:1px solid var(--line2);display:flex;gap:9px}
.drawer-foot .btn{flex:1}
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;color:var(--text2);margin-bottom:6px;font-weight:500}
.field input[type=text],.field input[type=number],.field input[type=url],.field input[type=date],.field select,.field textarea{
  width:100%;height:40px;padding:0 12px;border:1px solid var(--line);border-radius:9px;background:#fff;outline:none;
}
.field textarea{height:auto;min-height:88px;padding:10px 12px;line-height:1.6;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
.field .hint{font-size:11.5px;color:var(--text3);margin-top:5px}
.field.two{display:flex;gap:12px}
.field.two>div{flex:1;min-width:0}
.opt-row{display:flex;flex-wrap:wrap;gap:6px}
.opt{padding:6px 11px;border:1px solid var(--line);border-radius:20px;font-size:12.5px;color:var(--text2);background:#fff}
.opt.on{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}

/* settings */
.set-item{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line2)}
.set-item:last-child{border-bottom:0}
.set-main{flex:1}
.set-t{font-size:13.5px;font-weight:600}
.set-s{font-size:12px;color:var(--text3);margin-top:2px}
.danger{color:var(--red)}
.btn.danger-b{border-color:#f3c9cd;color:var(--red);background:#fff}
.btn.danger-b:hover{background:var(--red-soft)}

/* toast */
.toast{
  position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom));transform:translate(-50%,14px);
  background:#1d1d1f;color:#fff;font-size:13px;padding:10px 18px;border-radius:11px;z-index:80;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:88vw;text-align:center;
}
.toast.on{opacity:1;transform:translate(-50%,0)}
.banner{
  display:flex;align-items:center;gap:9px;background:var(--amber-soft);color:var(--amber);
  border:1px solid #f0dcbd;border-radius:var(--r2);padding:10px 13px;font-size:12.5px;margin-bottom:14px;
}
.banner.hide{display:none}

/* tabbar (mobile) */
.tabbar{display:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- responsive ---------- */
@media(max-width:980px){
  .board{grid-template-columns:repeat(2,minmax(200px,1fr))}
}
@media(max-width:768px){
  .sidebar{display:none}
  .main{padding-bottom:0}
  .topbar{padding:0 14px;height:52px}
  .page-desc{display:none}
  .scroll{padding:12px 14px calc(84px + env(safe-area-inset-bottom))}
  .board{grid-template-columns:1fr}
  .grid{grid-template-columns:1fr}
  .kpis{grid-template-columns:repeat(2,1fr);gap:9px}
  .kpi{padding:11px 12px}
  .kpi-v{font-size:19px}
  /* 触控区：所有可点控件 ≥44px，输入类字号 ≥16px（防 iOS 自动放大） */
  .btn,.btn.sm{height:44px;padding:0 14px;font-size:14px}
  .btn.ico-btn{width:44px;padding:0}
  .icon-btn{width:44px;height:44px}
  .icon-btn svg{width:18px;height:18px}
  .chip,.sel{height:40px;font-size:16px;padding:0 12px}
  .sel{padding:0 8px}
  .col-add{height:44px;font-size:14px}
  .opt{min-height:42px;display:inline-flex;align-items:center;padding:0 14px;font-size:14px}
  .field input[type=text],.field input[type=number],.field input[type=url],.field input[type=date],.field select{height:44px}
  .today-row{flex-wrap:wrap}
  .today-row .btn{margin-left:auto}
  .tcard .mini.b{min-height:36px;display:inline-flex;align-items:center;padding:0 12px}
  .toast{bottom:calc(96px + env(safe-area-inset-bottom))}
  .tabbar{
    display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(255,255,255,.94);
    backdrop-filter:blur(14px);border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom);
  }
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:8px 0 6px;color:var(--text3);font-size:11px;min-height:56px}
  .tab.on{color:var(--blue)}
  .tab svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .drawer{width:100%;height:92%;top:auto;border-radius:16px 16px 0 0;transform:translateY(102%)}
  .drawer.on{transform:none}
  .tbl-wrap{border-radius:var(--r2)}
  .row{flex-wrap:wrap}
}
</style>
</head>
<body>
<div id="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
      </div>
      <div>
        <div class="brand-name">美妆情报台</div>
        <div class="brand-sub">情报 · 选题 · 复盘</div>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <div class="sync-row">
        <span class="sync-dot" id="syncDot" data-sp-bindable="database" data-sp-database-id="SByOmCvTOwY3Ae700nplNF"></span>
        <span id="syncText">连接中…</span>
      </div>
      <div id="footStamp">资料库存取</div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <span class="page-title" id="pageTitle">情报库</span>
      <span class="page-desc" id="pageDesc"></span>

function toValue(m, f, v) {
  var s = v == null ? '' : String(v);
  if (f.t === 'number') return s === '' ? null : { number: Number(s) };
  if (f.t === 'date') return s === '' ? null : { date: s };
  if (f.t === 'url') return s === '' ? null : { url: { text: '原文', link: s } };
  if (f.t === 'select') return s === '' ? null : { select: optId(m, f.n, s) };
  return { text: s };
}
function fromValue(m, f, raw) {
  if (raw == null) return '';
  if (f.t === 'number') return String(raw);
  if (f.t === 'date') return dayStr(raw);
  if (f.t === 'url') return urlOf(raw);
  if (f.t === 'select') return optText(m, f.n, raw);
  return String(raw);
}
function openForm(key, rec, preset) {
  var m = mod(key);
  state.editing = { key: key, id: rec ? rec._id : null };
  formVals = {};
  m.fields.forEach(function (f) {
    formVals[f.n] = rec ? fromValue(m, f, rec[f.n]) : '';
  });
  if (!rec) {
    m.fields.forEach(function (f) {
      if (!formVals[f.n] && f.def === 'today') formVals[f.n] = todayStr();
      else if (!formVals[f.n] && f.def) formVals[f.n] = f.def;
    });
    if (preset && preset.statusField) formVals[m.statusField] = preset.statusField;
    if (preset && preset[state.editing.key]) formVals = Object.assign(formVals, preset[state.editing.key]);
    var d = readDraft(key);
    if (d) { for (var k in d) { if (formVals[k] === '' && d[k]) formVals[k] = d[k]; } }
  } else if (preset && preset.statusField) {
    formVals[m.statusField] = preset.statusField;
  }
  $('#formTitle').textContent = (rec ? '编辑' : '新建') + m.name;
  $('#formBody').innerHTML = m.fields.map(function (f) { return fieldHtml(m, f); }).join('');
  openDrawer('#formDrawer');
}
function fieldHtml(m, f) {
  var v = formVals[f.n] || '';
  var label = '<label>' + esc(f.n) + (f.req ? ' <span style="color:var(--red)">*</span>' : '') + '</label>';
  if (f.t === 'textarea') {
    return '<div class="field">' + label + '<textarea data-f="' + esc(f.n) + '" placeholder="' + esc(f.ph || '') + '">' + esc(v) + '</textarea></div>';
  }
  if (f.t === 'select') {
    var opts = optionsFor(m, f.n);
    return '<div class="field">' + label + '<div class="opt-row" data-optgroup="' + esc(f.n) + '">' +
      '<button type="button" class="opt' + (v === '' ? ' on' : '') + '" data-opt="" data-of="' + esc(f.n) + '">未选</button>' +
      opts.map(function (o) {
        return '<button type="button" class="opt' + (v === o.text ? ' on' : '') + '" data-opt="' + esc(o.text) + '" data-of="' + esc(f.n) + '">' + esc(o.text) + '</button>';
      }).join('') + '</div></div>';
  }
  var type = f.t === 'number' ? 'number' : (f.t === 'date' ? 'date' : (f.t === 'url' ? 'url' : 'text'));
  return '<div class="field">' + label + '<input type="' + type + '" data-f="' + esc(f.n) + '" value="' + esc(v) + '" placeholder="' + esc(f.ph || '') + '"></div>';
}
function collectForm() {
  $$('#formBody [data-f]').forEach(function (el) { formVals[el.getAttribute('data-f')] = el.value; });
  return formVals;
}
function readDraft(key) {
  try {
    var d = JSON.parse(localStorage.getItem(LS_DRAFT) || 'null');
    if (d && d.key === key && !d.id) return d.vals || null;
  } catch (e) { }
  return null;
}
function saveDraft() {
  if (!state.editing) return;
  try { localStorage.setItem(LS_DRAFT, JSON.stringify({ key: state.editing.key, id: state.editing.id, vals: collectForm() })); } catch (e) { }
}
function clearDraft() { try { localStorage.removeItem(LS_DRAFT); } catch (e) { } }
function saveForm() {
  var key = state.editing.key, m = mod(key);
  collectForm();
  var payload = {}, missing = [];
  m.fields.forEach(function (f) {
    var v = formVals[f.n];
    if (f.req && !String(v == null ? '' : v).trim()) missing.push(f.n);
    var pv = toValue(m, f, v);
    if (pv !== null) payload[f.n] = pv;
    else if (state.editing.id && (f.t === 'text' || f.t === 'textarea')) payload[f.n] = { text: '' };
  });
  if (missing.length) { toast('还差必填：' + missing.join('、')); return; }
  var btn = $('#formSave'); btn.disabled = true; btn.textContent = '保存中…';
  writeOne(key, state.editing.id, payload).then(function () {
    clearDraft(); closeDrawers(); toast(state.editing.id ? '已保存' : '已新建');
    return refreshTable(key);
  }).catch(function (err) {
    toast('保存失败：' + msgOf(err));
  }).then(function () {
    btn.disabled = false; btn.textContent = '保存';
  });
}
function refreshTable(key) {
  return loadOne(key).then(function () { refreshAll(); });
}

/* ---------- 9. 设置 / 备份 ---------- */
function exportJson() {
  var dump = { app: '美妆情报台', exportedAt: new Date().toISOString(), data: state.data };
  var blob = new Blob([JSON.stringify(dump, null, 2)], { type: 'application/json' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '美妆情报台_备份_' + todayStr() + '.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function () { URL.revokeObjectURL(a.href); }, 3000);
  toast('已导出备份文件');
}
function importJson(text) {
  var parsed;
  try { parsed = JSON.parse(text); } catch (e) { toast('文件不是有效的 JSON'); return; }
  var data = parsed && parsed.data ? parsed.data : parsed;
  if (!data || typeof data !== 'object') { toast('文件里没有可恢复的数据'); return; }
  var chain = Promise.resolve(), added = 0;
  MODULES.forEach(function (m) {
    var rows = data[m.key];
    if (!Array.isArray(rows) || !rows.length) return;
    chain = chain.then(function () {
      var sub = Promise.resolve();
      rows.forEach(function (r) {
        var payload = {};
        m.fields.forEach(function (f) {
          var pv = toValue(m, f, fromValue(m, f, r[f.n]));
          if (pv !== null) payload[f.n] = pv;
        });
        if (!payload[m.primary]) return;
        sub = sub.then(function () { added++; return writeOne(m.key, null, payload); });
      });
      return sub.then(function () { return loadOne(m.key); });
    });
  });
  chain.then(function () { refreshAll(); toast('导入完成，新增 ' + added + ' 条'); })
    .catch(function (err) { toast('导入出错：' + msgOf(err)); refreshAll(); });
}
function clearDemo() {
  var jobs = [];
  MODULES.forEach(function (m) {
    recs(m.key).forEach(function (r) { if (isDemo(r, m)) jobs.push(removeOne(m.key, r._id)); });
  });
  if (!jobs.length) { toast('没有找到示例数据'); return; }
  Promise.all(jobs).then(function () {
    MODULES.forEach(function (m) { if (state.ready[m.key]) loadOne(m.key); });
    return new Promise(function (res) { setTimeout(res, 400); });
  }).then(function () { loadAll().then(refreshAll); toast('示例数据已清空'); })
    .catch(function (err) { toast('清空失败：' + msgOf(err)); });
}
function clearAll() {
  if (!window.confirm('确定要清空全部数据吗？四张表的记录都会被删除，无法恢复。')) return;
  if (!window.confirm('再确认一次：真的删除全部业务记录？')) return;
  var jobs = [];
  MODULES.forEach(function (m) { recs(m.key).forEach(function (r) { jobs.push(removeOne(m.key, r._id)); }); });
  if (!ONLINE) lsDel();
  Promise.all(jobs).then(function () { lsDel(); return loadAll(); }).then(function () { refreshAll(); toast('已清空全部记录'); })
    .catch(function (err) { toast('清空失败：' + msgOf(err)); });
}

/* ---------- 10. 今日动作 ---------- */
function doAction(act, key, id) {
  var m = mod(key), r = null;
  recs(key).forEach(function (x) { if (x._id === id) r = x; });
  if (!r) return;
  var payload = null;
  if (act === 'postpone') payload = { '计划发布日期': { date: todayStr() } };
  else if (act === 'markPublished') payload = { '状态': { select: optId(m, '状态', '已发布') } };
  else if (act === 'pickIntel') payload = { '状态': { select: optId(m, '状态', '已选') } };
  else if (act === 'activateSource') payload = { '状态': { select: optId(m, '状态', '正常') } };
  else if (act === 'edit') { openForm(key, r); return; }
  if (!payload) return;
  writeOne(key, id, payload).then(function () { return refreshTable(key); })
    .then(function () { toast('已更新'); })
    .catch(function (err) { toast('更新失败：' + msgOf(err)); });
}
function moveStatus(key, id, to) {
  var m = mod(key);
  writeOne(key, id, { '状态': { select: optId(m, '状态', to) } })
    .then(function () { return refreshTable(key); }).then(function () { toast('已移到「' + to + '」'); })
    .catch(function (err) { toast('移动失败：' + msgOf(err)); });
}
function delRecord(key, id) {
  var m = mod(key), name = '';
  recs(key).forEach(function (r) { if (r._id === id) name = r[m.primary]; });
  if (!window.confirm('删除「' + (name || '这条记录') + '」？无法恢复。')) return;
  removeOne(key, id).then(function () { return refreshTable(key); }).then(function () { toast('已删除'); })
    .catch(function (err) { toast('删除失败：' + msgOf(err)); });
}

/* ---------- 11. 事件绑定 ---------- */
function bindEvents() {
  document.addEventListener('click', function (e) {
    var t = e.target.closest ? e.target.closest('[data-go],[data-edit],[data-del],[data-new],[data-act],[data-move],[data-open],[data-opt],[data-filter-clear]') : null;
    if (!t) return;
    var g;
    if ((g = t.getAttribute('data-go'))) { state.view = g; refreshAll(); return; }
    if ((g = t.getAttribute('data-filter-clear'))) { state.filter[g] = {}; refreshAll(); return; }
    if ((g = t.getAttribute('data-opt')) !== null && t.hasAttribute('data-opt')) {
      var of = t.getAttribute('data-of');
      formVals[of] = g;
      $$('[data-of="' + of + '"]', $('#formBody')).forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-opt') === g); });
      saveDraft(); return;
    }
    if ((g = t.getAttribute('data-edit'))) { var r = null; recs(g).forEach(function (x) { if (x._id === t.getAttribute('data-id')) r = x; }); if (r) openForm(g, r); return; }
    if ((g = t.getAttribute('data-del'))) { delRecord(g, t.getAttribute('data-id')); return; }
    if ((g = t.getAttribute('data-act'))) { doAction(g, t.getAttribute('data-key'), t.getAttribute('data-id')); return; }
    if ((g = t.getAttribute('data-move'))) { moveStatus(g, t.getAttribute('data-id'), t.getAttribute('data-to')); return; }
    if ((g = t.getAttribute('data-open'))) {
      var r2 = null; recs(g).forEach(function (x) { if (x._id === t.getAttribute('data-id')) r2 = x; });
      if (r2) openForm(g, r2);
      return;
    }
    if ((g = t.getAttribute('data-new'))) {
      if (g === 'content') openForm('content', null, { statusField: t.getAttribute('data-status') });
      else openForm(g, null);
      return;
    }
  });
  document.addEventListener('change', function (e) {
    var el = e.target;
    if (el.getAttribute && el.getAttribute('data-filter')) {
      var key = el.getAttribute('data-filter'), fn = el.getAttribute('data-field');
      state.filter[key][fn] = el.value; refreshAll(); return;
    }
  });
  document.addEventListener('input', function (e) {
    var el = e.target, f = el.getAttribute && el.getAttribute('data-f');
    if (f) { formVals[f] = el.value; clearTimeout(draftTimer); draftTimer = setTimeout(saveDraft, 300); return; }
    if (el.id === 'qIntel' || el.id === 'qContent' || el.id === 'qSource') {
      var key = el.id === 'qIntel' ? 'intel' : (el.id === 'qContent' ? 'content' : 'source');
      state.query[key] = el.value;
      clearTimeout(el._t); el._t = setTimeout(refreshAll, 160);
    }
  });
  $('#btnNew').addEventListener('click', function () { openForm(state.view, null); });
  $('#btnRefresh').addEventListener('click', function () { loadAll().then(function () { refreshAll(); toast('已刷新'); }); });
  $('#btnSettings').addEventListener('click', function () { openDrawer('#setDrawer'); });
  $('#mask').addEventListener('click', closeDrawers);
  $('#formClose').addEventListener('click', closeDrawers);
  $('#formCancel').addEventListener('click', closeDrawers);
  $('#setClose').addEventListener('click', closeDrawers);
  $('#formSave').addEventListener('click', saveForm);
  $('#btnExport').addEventListener('click', exportJson);
  $('#btnImport').addEventListener('click', function () { $('#fileImport').click(); });
  $('#fileImport').addEventListener('change', function (e) {
    var f = e.target.files && e.target.files[0];
    if (!f) return;
    var fr = new FileReader();
    fr.onload = function () { importJson(String(fr.result)); };
    fr.onerror = function () { toast('读取文件失败'); };
    fr.readAsText(f);
    e.target.value = '';
  });
  $('#btnClearDemo').addEventListener('click', clearDemo);
  $('#btnClearAll').addEventListener('click', clearAll);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeDrawers(); });
}

/* ---------- 12. 变更订阅（整页只注册一次） ---------- */
function subscribeUpdates() {
  if (!db || typeof db.onUpdated !== 'function') return;
  var timer = null;
  db.onUpdated(function (payload) {
    var ids = (payload && payload.databaseIds) || [];
    var keys = [];
    MODULES.forEach(function (m) { if (ids.indexOf(DB[m.key].databaseId) !== -1) keys.push(m.key); });
    if (!keys.length) return;
    if (timer) clearTimeout(timer);
    timer = setTimeout(function () {
      timer = null;
      Promise.all(keys.map(loadOne)).then(refreshAll);
    }, 400);
  });
}

    { _id: uid(), '信息源名称': '【示例】KEV 美妆圈中国区', '类型': 'API', '地址': null, '覆盖区域': '中国', '更新频率': '每日', '状态': '待接入', '备注': '示例：待打通接口后并入情报库。' }

  lsWrite(all);

/* ---------- 14. 初始化（固定顺序：读数据 → 绑事件 → 订阅 → 渲染） ---------- */
function init() {
  if (!ONLINE) {
    seedLocalIfEmpty();
    $('#offBanner').classList.remove('hide');
  }
  $('#setWhere').textContent = ONLINE
    ? '四张数据表存放在 WorkBuddy 资料库，云端存储、多设备自动同步。'
    : '数据只存在这台设备的浏览器里（离线模式），建议定期导出备份。';
  state.view = 'intel';
  bindEvents();
  subscribeUpdates();
  refreshAll();
  loadAll().then(refreshAll);
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();
