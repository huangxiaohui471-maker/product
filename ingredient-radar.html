    function renderDiscovery(){const el=$('#discovery-grid');el.innerHTML=discoveryData.map(x=>`<article class="discovery-card"><div class="push-top"><h3>${x.name}</h3><span class="push-tag">${x.signal}</span></div><div class="discovery-meta"><span>${x.market}</span><span>${x.evidence}</span></div><a href="${x.url}" target="_blank" rel="noopener">来源 ↗</a></article>`).join('');}
    async function hydrateLatest(){try{const payload=await fetch('data/ingredient/latest.json?ts='+Date.now()).then(r=>r.ok?r.json():null);const rows=(payload?.new_ingredients||[]).filter(x=>x.name);if(!rows.length)return;const urls={美国:'https://www.fastmoss.com/zh',中国:'https://compass.jinritemai.com/',日本:'https://www.tiktok.com/',韩国:'https://www.fastmoss.com/'};discoveryData.splice(0,discoveryData.length,...rows.map(x=>({name:x.name,signal:x.signal,market:x.market,evidence:x.evidence,reason:`${x.source||'平台页面'}已捕捉到该成分线索，建议继续核验商品规模、内容声量与供应稳定性。`,url:urls[x.market]||'https://www.fastmoss.com/'})));renderDiscovery();const badge=document.querySelector('.discovery-badge');if(badge)badge.textContent=`每国 1 项 · ${rows.length} 个市场 · ${payload.generated_at?.slice(11,16)||'最新'}`;}catch(e){/* 无后台快照时保留 Demo 数据 */}}
    function renderAiBrief(){const m=markets[selected];const text=selected==='US'?'美国视黄醇、神经酰胺和胜肽同时出现销售与内容信号；视黄醇排名上升最快，适合进入配方方向研究。':selected==='CN'?'中国依克多因和水杨酸热度靠前，修护与控油需求并行；依克多因更适合做差异化切入。':selected==='JP'?'日本米糠发酵物排名上升5位，内容趋势先于商品扩散；建议继续观察新增商品和复购反馈。':'韩国积雪草处于高位稳定，泛醇和益生菌仍在上升；普通积雪草赛道竞争偏拥挤。';$('#ai-brief').innerHTML=`<div class="ai-mark">AI</div><div><b>${m.name} · 全球趋势解读</b><p>${text}</p></div><small>证据：${sourceMap[selected]}<br>置信度：A/B</small>`;}
    function renderMarkets(){const el=$('#markets');el.innerHTML=Object.entries(markets).map(([key,m])=>`<button type="button" class="market ${key===selected?'on':''}" data-market="${key}"><div class="market-head"><div><div class="market-name">${m.name}</div><div class="market-code">${m.code} · ${m.source}</div></div><span class="market-state">${m.state}</span></div><div class="market-list">${m.items.slice(0,4).map(x=>`<div class="market-item"><span>${x[0]}</span><span class="${x[2]>0?'rise':x[2]===0?'stable':'trend-flat'}">${x[2]>0?'↑ '+x[2]:x[2]===0?'—':'↓ '+Math.abs(x[2])}</span></div>`).join('')}</div><div class="market-foot"><span>Top20 可查看</span><span>›</span></div></button>`).join('');}
    function renderTable(){const m=markets[selected],items=allItems(selected);$('#list-title').textContent=`${m.name} · 成分前沿 Top20`;$('#list-sub').textContent=`近${period}天热度变化 · 点击成分查看借鉴信息`;$('#source-pill').textContent=m.source+' · Voyager Atlas';const switcher=`<div class="market-switch" role="tablist">${Object.entries(markets).map(([key,v])=>`<button type="button" data-table-market="${key}" class="${key===selected?'on':''}" aria-selected="${key===selected}">${v.name}</button>`).join('')}</div>`;$('#market-switch').innerHTML=switcher;$('#table-wrap').innerHTML=`<table class="table"><thead><tr><th>#</th><th>成分</th><th>热度</th><th>变化</th><th>主要部位</th><th>来源</th></tr></thead><tbody>${items.slice(0,20).map((x,i)=>`<tr class="${x.name===selectedIngredient?'on':''}" data-ingredient="${esc(x.name)}"><td><span class="rank">${i+1}</span></td><td><div class="ingredient">${esc(x.name)}</div><div class="effect-line">${effect(x.name)}</div><div class="sub">${i<5?'核心热度':'增长观察'}</div></td><td><div class="heat">${x.heat}</div><div class="bar"><i style="width:${x.heat}%"></i></div></td><td class="${x.move>0?'trend-up':x.move===0?'trend-flat':'trend-flat'}">${x.move>0?'↑ '+x.move+'名':x.move===0?'—':'↓ '+Math.abs(x.move)+'名'}</td><td class="use">${x.body}</td><td><a class="source-link" href="${x.url}" target="_blank" rel="noopener" aria-label="打开${x.name}来源">打开 ↗</a></td></tr>`).join('')}</tbody></table>`;renderDetail();renderAiBrief();}
    function renderDetail(){const m=markets[selected],x=allItems(selected).find(v=>v.name===selectedIngredient)||allItems(selected)[0];selectedIngredient=x.name;const seed=x.heat;const vals=[seed-18,seed-10,seed-13,seed-6,seed-3,seed-5,seed];$('#detail').innerHTML=`<div class="detail-kicker">${m.name} · ingredient signal</div><h2>${esc(x.name)}</h2><p>${m.source} · 近${period}天趋势</p><div class="effect-line">功效：${effect(x.name)}</div><div class="chips"><span class="chip">${x.move>2?'快速上升':x.move>0?'上升':'稳定'}</span><span class="chip">${x.products} 个关联商品</span><span class="chip">${x.rank<=5?'核心热度':'增长观察'}</span><span class="chip confidence">置信度 ${x.confidence}</span></div><div class="trend-chart">${vals.map((v,i)=>`<div class="bar-col"><i style="height:${Math.max(18,v)}%"></i><small>${i===6?'今':'-'+(6-i)}</small></div>`).join('')}</div><div class="detail-grid"><div class="metric"><span>当前热度</span><b>${x.heat}</b></div><div class="metric"><span>排名变化</span><b class="${x.move>0?'trend-up':''}">${x.move>0?'↑ '+x.move+'名':x.move===0?'—':'↓ '+Math.abs(x.move)+'名'}</b></div><div class="metric"><span>主要部位</span><b>${x.body}</b></div><div class="metric"><span>借鉴状态</span><b>${x.move>2?'值得观察':'可研究'}</b></div></div><div class="recommend"><small>AI趋势解读</small>${x.move>2?'社媒声量先于商品增长，建议继续观察并寻找适合本地市场的剂型。':'已有市场验证，可从价格带、剂型或使用场景中寻找差异化切入点。'}</div><div class="link-list"><a class="source-link" href="${x.url}" target="_blank" rel="noopener">商品/榜单来源 ↗</a><a class="source-link" href="https://www.tiktok.com/" target="_blank" rel="noopener">相关内容 ↗</a></div>`;}
    document.addEventListener('click',e=>{const tableMarket=e.target.closest('[data-table-market]');if(tableMarket){selected=tableMarket.dataset.tableMarket;selectedIngredient=markets[selected].items[0][0];renderMarkets();renderTable();return}const market=e.target.closest('[data-market]');if(market){selected=market.dataset.market;selectedIngredient=markets[selected].items[0][0];renderMarkets();renderTable();return}const row=e.target.closest('[data-ingredient]');if(row){selectedIngredient=row.dataset.ingredient;renderTable();return}const p=e.target.closest('[data-period]');if(p){period=Number(p.dataset.period);document.querySelectorAll('[data-period]').forEach(b=>b.classList.toggle('on',b===p));renderTable();}});
    renderPush();renderDiscovery();renderMarkets();renderTable();renderAiBrief();hydrateLatest();
    (function jumpToRequestedSection(){var id=decodeURIComponent(location.hash.replace(/^#/,''));if(!id)return;window.setTimeout(function(){var el=document.getElementById(id);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});},80);})();
  </script>
</body>
</html>
