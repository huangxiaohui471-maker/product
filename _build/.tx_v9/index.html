<!DOCTYPE html>
<html data-page-node-id="9m2l0OI1shz189XUwJ7jP7" lang="zh-CN">
<head data-page-node-id="UMy3xmQnUGl6eEnTgeuX9X">
<script data-page-node-id="pZy4iZFG6yzu035Nf4FzsF" src="/page/page_comm/inject.js"></script>

<style data-page-node-id="1bgz7HEdCetIs1Qq2zr6ee" data-pnid-children="sqiMHC9QoIdhFgxHq97Ube">
:root{
  --bg:#F5F5F7;--surface:#FFFFFF;--surface-2:#FAFAFC;
  --line:#E6E6EA;--line-2:#F0F0F3;
  --text:#1D1D1F;--sub:#6E6E73;--hint:#8E8E93;
  --blue:#0071E3;--blue-soft:#EAF3FE;--blue-deep:#0058B0;
  --up:#D93A2B;--up-soft:#FDEDEB;--down:#1B8A4B;--down-soft:#EAF6EE;
  --amber:#B26A00;--amber-soft:#FFF4E5;--purple:#6E4BD1;--purple-soft:#F1EDFC;
  --teal:#0E7C6B;--teal-soft:#E6F5F2;
  --r:12px;--r-s:8px;--r-l:16px;
  --sh:0 1px 2px rgba(0,0,0,.04);
  --side-w:212px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--text);
  font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
h1,h2,h3,p{margin:0}
svg{display:block}
.ic{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ic-s{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* ---------- 布局 ---------- */
.app{display:block}
.side{
  position:fixed;left:0;top:0;bottom:0;width:var(--side-w);z-index:30;
  background:var(--surface);border-right:1px solid var(--line);
  display:flex;flex-direction:column;padding:16px 12px;
}
.brand{display:flex;align-items:center;gap:9px;padding:4px 8px 18px}
.brand-mark{
  width:30px;height:30px;border-radius:9px;background:var(--blue);color:#fff;
  display:flex;align-items:center;justify-content:center;flex:none;
}
.brand-mark svg{width:17px;height:17px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.brand-text{min-width:0}
.brand-text b{display:block;font-size:14px;font-weight:500;letter-spacing:.2px}
.brand-text i{display:block;font-style:normal;font-size:10.5px;color:var(--hint);letter-spacing:.3px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-item{
  display:flex;align-items:center;gap:10px;min-height:44px;padding:0 10px;
  border-radius:var(--r-s);color:var(--sub);font-size:13.5px;text-align:left;width:100%;
}
.nav-item:hover{background:var(--surface-2);color:var(--text)}
.nav-item.on{background:var(--blue-soft);color:var(--blue-deep);font-weight:500}
.nav-item .n{margin-left:auto;font-size:11.5px;color:var(--hint);font-weight:400}
.side-foot{margin-top:auto;padding-top:12px;border-top:1px solid var(--line-2)}
.sync{display:flex;align-items:center;gap:7px;padding:8px 10px 10px;font-size:11.5px;color:var(--hint)}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--down);flex:none}
.sync-dot.off{background:var(--hint)}
.sync-dot.busy{background:var(--amber);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.28}}
.side-actions{display:flex;gap:6px}
.side-actions button{
  flex:1;min-height:36px;border-radius:var(--r-s);background:var(--surface-2);
  border:1px solid var(--line);font-size:12.5px;color:var(--sub);
}
.side-actions button:hover{border-color:#D5D5DA;color:var(--text)}

.main{margin-left:var(--side-w);min-height:100vh;padding-bottom:32px}
.topbar{
  position:sticky;top:0;z-index:20;background:rgba(245,245,247,.86);
  backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--line);padding:14px 24px 0;
}
.topbar-row{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap}
.topbar-title h1{font-size:19px;font-weight:500;letter-spacing:.2px}
.topbar-title p{font-size:12.5px;color:var(--hint);margin-top:3px}
.topbar-tools{margin-left:auto;display:flex;align-items:center;gap:8px}
.search{
  display:flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--line);
  border-radius:9px;padding:0 11px;height:38px;min-width:250px;
}
.search svg{color:var(--hint);flex:none}
.search input{
  border:0;outline:0;background:none;font-size:13.5px;width:100%;height:100%;
}
.icon-btn{
  width:38px;height:38px;border-radius:9px;background:var(--surface);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;color:var(--sub);
}
.icon-btn:hover{border-color:#D5D5DA;color:var(--text)}
.chips{display:flex;gap:6px;align-items:center;padding:11px 0 13px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:none;height:30px;padding:0 12px;border-radius:15px;background:var(--surface);
  border:1px solid var(--line);font-size:12.5px;color:var(--sub);white-space:nowrap;
}
.chip:hover{border-color:#D5D5DA}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.chip .cn{font-size:10.5px;opacity:.6;margin-left:3px}
.chip-sep{flex:none;width:1px;height:18px;background:var(--line);margin:0 5px}
.view{padding:18px 24px 40px}

/* ---------- 通用块 ---------- */
.sec{margin-bottom:22px}
.sec-hd{display:flex;align-items:baseline;gap:10px;margin-bottom:11px}
.sec-hd h2{font-size:15px;font-weight:500}
.sec-hd span{font-size:12px;color:var(--hint)}
.sec-hd .r{margin-left:auto;font-size:12px;color:var(--hint)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.grid{display:grid;gap:12px}
.g-kpi{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.g-2{grid-template-columns:1fr 1fr}
.g-3{grid-template-columns:repeat(3,1fr)}
.kpi{padding:14px 16px}
.kpi .lb{font-size:12px;color:var(--hint)}
.kpi .vl{font-size:22px;font-weight:500;margin-top:5px;letter-spacing:.3px}
.kpi .vl small{font-size:12.5px;font-weight:400;color:var(--hint);margin-left:3px}
.kpi .ft{font-size:11.5px;color:var(--hint);margin-top:4px}
.pad{padding:16px}
.up{color:var(--up)}
.down{color:var(--down)}
.muted{color:var(--hint)}
.tag{
  display:inline-flex;align-items:center;height:21px;padding:0 8px;border-radius:6px;
  font-size:11.5px;background:var(--surface-2);border:1px solid var(--line);color:var(--sub);white-space:nowrap;
}
.tag.b{background:var(--blue-soft);border-color:#CFE4FB;color:var(--blue-deep)}
.tag.r{background:var(--up-soft);border-color:#F8D7D2;color:#A52214}
.tag.g{background:var(--down-soft);border-color:#CFE8D8;color:#14663A}
.tag.a{background:var(--amber-soft);border-color:#FBE0B4;color:var(--amber)}
.tag.p{background:var(--purple-soft);border-color:#DDD3F8;color:var(--purple)}
.tag.t{background:var(--teal-soft);border-color:#C7E8E1;color:var(--teal)}
.empty{padding:44px 20px;text-align:center;color:var(--hint);font-size:13px}
.empty b{display:block;color:var(--sub);font-weight:500;font-size:14px;margin-bottom:5px}

/* ---------- 榜单 ---------- */
.rank-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.rank-tab{
  min-height:34px;padding:0 14px;border-radius:17px;background:var(--surface);
  border:1px solid var(--line);font-size:13px;color:var(--sub);
}
.rank-tab.on{background:var(--text);border-color:var(--text);color:#fff}
.rk-list{display:flex;flex-direction:column}
.rk{
  display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;
  padding:12px 16px;border-bottom:1px solid var(--line-2);text-align:left;width:100%;
}
.rk:last-child{border-bottom:0}
.rk:hover{background:var(--surface-2)}
.rk-no{font-size:15px;font-weight:500;color:var(--hint);text-align:center}
.rk-no.top{color:var(--blue)}
.rk-main{min-width:0}
.rk-name{font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rk-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:5px;font-size:11.5px;color:var(--hint)}
.rk-val{text-align:right;font-size:14px;font-weight:500;white-space:nowrap}
.rk-val small{display:block;font-size:11px;font-weight:400;color:var(--hint);margin-top:3px}
.bar{display:block;height:4px;border-radius:2px;background:var(--line-2);margin-top:7px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:2px;background:var(--blue)}

/* ---------- 卡片流 ---------- */
.cards{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(232px,1fr))}
.pc{padding:14px;text-align:left;display:block;width:100%}
.pc-hd{display:flex;align-items:flex-start;gap:8px;margin-bottom:8px}
.pc-name{font-size:13.5px;font-weight:500;line-height:1.45;flex:1;min-width:0}
.pc-price{font-size:15px;font-weight:500;white-space:nowrap}
.pc-brand{font-size:11.5px;color:var(--hint);margin-bottom:9px}
.pc-kv{display:flex;justify-content:space-between;gap:8px;font-size:12px;padding:3px 0}
.pc-kv span:first-child{color:var(--hint)}
.pc-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}

/* ---------- 洞察 ---------- */
.ins{padding:16px;display:flex;flex-direction:column;gap:11px}
.ins-hd{display:flex;align-items:flex-start;gap:10px}
.ins-icon{
  width:32px;height:32px;border-radius:9px;flex:none;display:flex;align-items:center;justify-content:center;
  background:var(--blue-soft);color:var(--blue-deep);
}
.ins-icon.r{background:var(--up-soft);color:#A52214}
.ins-icon.g{background:var(--down-soft);color:#14663A}
.ins-icon.p{background:var(--purple-soft);color:var(--purple)}
.ins-t{font-size:14px;font-weight:500}
.ins-d{font-size:12.5px;color:var(--sub);margin-top:2px}
.ins-ev{background:var(--surface-2);border-radius:var(--r-s);padding:10px 12px;font-size:12.5px;color:var(--sub)}
.ins-ev b{color:var(--text);font-weight:500}
.ins-list{display:flex;flex-direction:column;gap:1px}
.ins-row{
  display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:var(--r-s);
  background:var(--surface);border:1px solid var(--line-2);text-align:left;width:100%;
}
.ins-row:hover{border-color:#D5D5DA}
.ins-row .nm{flex:1;min-width:0;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ins-row .vv{font-size:12.5px;font-weight:500;white-space:nowrap}

/* ---------- 抽屉 / 弹层 ---------- */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.28);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.mask.on{opacity:1;pointer-events:auto}
.drawer{
  position:fixed;top:0;right:0;bottom:0;width:min(460px,92vw);background:var(--surface);z-index:50;
  transform:translateX(101%);transition:transform .26s cubic-bezier(.32,.72,0,1);
  display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.1);
}
.drawer.on{transform:none}
.dw-hd{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.dw-hd h3{font-size:15px;font-weight:500;flex:1;line-height:1.45}
.dw-bd{flex:1;overflow-y:auto;padding:4px 18px 30px;-webkit-overflow-scrolling:touch}
.dw-grp{font-size:11.5px;color:var(--hint);padding:16px 0 7px;border-bottom:1px solid var(--line-2);margin-bottom:2px}
.dw-r{display:flex;gap:14px;padding:9px 0;border-bottom:1px solid var(--line-2);font-size:13px}
.dw-r .k{width:96px;flex:none;color:var(--hint);font-size:12.5px}
.dw-r .v{flex:1;word-break:break-word}
.dw-note{margin-top:14px;background:var(--surface-2);border-radius:var(--r-s);padding:12px;font-size:12.5px;color:var(--sub);line-height:1.7}
.modal{
  position:fixed;left:50%;top:50%;transform:translate(-50%,-46%);width:min(620px,94vw);max-height:86vh;
  background:var(--surface);border-radius:var(--r-l);z-index:50;display:none;flex-direction:column;
  box-shadow:0 20px 60px rgba(0,0,0,.2);overflow:hidden;
}
.modal.on{display:flex}
.modal.wide{width:min(1000px,94vw)}
.md-hd{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.md-hd h3{font-size:15px;font-weight:500;flex:1}
.md-bd{padding:18px;overflow-y:auto}
.md-ft{padding:13px 18px;border-top:1px solid var(--line);display:flex;gap:9px;justify-content:flex-end;flex-wrap:wrap}
.btn{
  min-height:40px;padding:0 18px;border-radius:9px;background:var(--blue);color:#fff;font-size:13.5px;
}
.btn:hover{background:var(--blue-deep)}
.btn.sec{background:var(--surface);color:var(--sub);border:1px solid var(--line)}
.btn.sec:hover{border-color:#D5D5DA;color:var(--text)}
.btn.danger{background:var(--up)}
textarea.ta{
  width:100%;min-height:190px;border:1px solid var(--line);border-radius:var(--r-s);padding:11px;
  font-size:13px;line-height:1.6;outline:0;resize:vertical;background:var(--surface-2);
}
textarea.ta:focus{border-color:var(--blue);background:var(--surface)}
.hint{font-size:12px;color:var(--hint);line-height:1.7}
.toast{
  position:fixed;left:50%;bottom:76px;transform:translate(-50%,14px);z-index:70;
  background:rgba(29,29,31,.93);color:#fff;font-size:13px;padding:10px 17px;border-radius:10px;
  opacity:0;pointer-events:none;transition:.22s;max-width:88vw;text-align:center;
}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- 图表辅助 / 市场对比 ---------- */
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:10px}
.lg{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--sub)}
.lg i{width:9px;height:9px;border-radius:50%;display:inline-block}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:7px;vertical-align:1px}
.cmp-hd,.cmp-r{
  display:grid;grid-template-columns:1.2fr .8fr 1.1fr 1fr .9fr 1.1fr;gap:8px;
  align-items:center;padding:10px 16px;font-size:12.5px;
}
.cmp-hd{color:var(--hint);font-size:11.5px;border-bottom:1px solid var(--line)}
.cmp-r{border-bottom:1px solid var(--line-2)}
.cmp-r:last-child{border-bottom:0}
.cmp-hd span:nth-child(n+2),.cmp-r span:nth-child(n+2){text-align:right}
.cmp-r span:first-child{font-weight:500}
.rk-name{display:block}
.pc-brand{display:block}
.ins-t,.ins-d{display:block}
.ins-hd>span:last-child{flex:1;min-width:0}
@media (max-width:860px){
  .cmp-hd{display:none}
  .cmp-r{grid-template-columns:1fr 1fr;grid-auto-rows:auto;gap:6px 10px;padding:12px 14px;font-size:12.5px}
  .cmp-r span:nth-child(n+2){text-align:right}
  .cmp-r span:first-child{grid-column:1 / -1}
}
/* ---------- 移动端 ---------- */
.tabbar{display:none}
@media (max-width:860px){
  .side{display:none}
  .main{margin-left:0;padding-bottom:calc(72px + env(safe-area-inset-bottom))}
  .topbar{padding:12px 14px 0}
  .view{padding:14px 14px 24px}
  .topbar-title h1{font-size:17px}
  .topbar-tools{width:100%;margin-left:0}
  .search{min-width:0;flex:1}
  .g-2,.g-3{grid-template-columns:1fr}
  .cards{grid-template-columns:1fr}
  .rk{grid-template-columns:28px 1fr auto;gap:9px;padding:11px 13px}
  .rk-name{font-size:13px}
  .tabbar{
    display:flex;position:fixed;left:0;right:0;bottom:0;z-index:35;
    background:rgba(255,255,255,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);
  }
  .tabbar button{
    flex:1;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    color:var(--hint);font-size:10.5px;
  }
  .tabbar button.on{color:var(--blue)}
  .toast{bottom:calc(72px + env(safe-area-inset-bottom))}
  .drawer{width:100vw;top:auto;bottom:0;height:88vh;border-radius:16px 16px 0 0;transform:translateY(101%)}
  .drawer.on{transform:none}
  .modal{width:100vw;max-width:100vw;max-height:92vh;top:auto;bottom:0;left:0;transform:none;border-radius:16px 16px 0 0}
  /* iOS 会对 <16px 的输入框自动放大页面 —— 移动端输入类一律 16px */
  input,textarea,select,#kw{font-size:16px}
  textarea.ta{font-size:16px;line-height:1.55}
  .mini{min-height:44px;padding:0 15px}
  .src-card{padding:14px}
}

/* ---------- 数据源地图 / 取数路径 ---------- */
.src-grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(224px,1fr))}
.src-card{border:1px solid var(--line);border-radius:var(--r-s);padding:12px;background:var(--surface-2);cursor:pointer;transition:.15s;text-align:left;width:100%}
.src-card:hover{border-color:#C9C9CF;background:var(--surface)}
.src-card.on{border-color:var(--blue);background:#F2F7FE;box-shadow:0 0 0 1px var(--blue) inset}
.src-card .sh{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:500}
.src-card .sm{font-size:11.5px;color:var(--hint);margin-top:6px;line-height:1.65}
.badge{display:inline-flex;align-items:center;font-size:10.5px;padding:1.5px 6px;border-radius:5px;font-weight:500;white-space:nowrap}
.badge.ok{background:var(--down-soft);color:#14663A}
.badge.part{background:var(--amber-soft);color:#8A5A00}
.badge.no{background:var(--up-soft);color:#A52214}
.badge.man{background:var(--purple-soft);color:var(--purple)}
.mk-flow{display:flex;flex-direction:column;gap:1px}
.mk-r{display:grid;grid-template-columns:74px 58px 1fr;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line-2);font-size:12.5px}
.mk-r:last-child{border-bottom:0}
.mk-r .mn{font-weight:500}
.mk-r .mt{color:var(--sub);line-height:1.65}
.path{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;color:var(--sub);background:var(--surface-2);border:1px solid var(--line-2);border-radius:6px;padding:7px 9px;line-height:1.6;word-break:break-all}
.smap-tb{width:100%;border-collapse:collapse;font-size:12.5px}
.smap-tb th{text-align:left;font-weight:500;color:var(--hint);font-size:11.5px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.smap-tb td{padding:9px 10px;border-bottom:1px solid var(--line-2);vertical-align:top;line-height:1.65}
.smap-tb tr:last-child td{border-bottom:0}
.smap-wrap{overflow-x:auto}
.smap-tb{min-width:820px}

/* ---------- 覆盖度热力格 ---------- */
.cov-wrap{overflow-x:auto;padding:2px 0}
.cov{display:grid;gap:3px;min-width:520px;grid-template-columns:76px repeat(6,1fr)}
.cov .ch{font-size:11px;color:var(--hint);text-align:center;padding:4px 0}
.cov .rh{font-size:12px;color:var(--sub);display:flex;align-items:center;gap:5px;padding-right:6px}

    if (g !== null && g >= WIN_MIN_GROWTH) win.push(r);
    if (bad !== '') fix.push(r);
    if (overlap === '全新' && g !== null && g >= 25) blank.push(r);
    if (filing === '普通化妆品备案' && hard === '无需评价' && ratio !== null && ratio <= 0.25) ready.push(r);
    if ((g !== null && g < 0) || HIGH_RISK_WORD.test(bad)) risk.push(r);
    /* 新品机会：上市 90 天内且已经在起量，说明这个方向刚被市场验证过 */
    var d = daysSince(r['上市日期']);
    if (d !== null && d <= NEW_MAX_DAYS && g !== null && g >= NEW_MIN_GROWTH && (sd === null || sd >= NEW_MIN_SOLD)) newp.push(r);
  }
  /* 市场机会：国家/地区 × 二级类目 的格子，样本够且平均在涨 */
  var cells = {}, j;
  for (j = 0; j < list.length; j++) {
    var rj = list[j], ct = txtOf(rj, '国家/地区'), c2 = txtOf(rj, '二级类目');
    if (!ct || !c2) continue;
    var gv = numField(rj, '环比增速');
    if (gv === null) continue;
    var key = ct + '\u0001' + c2;
    if (!cells[key]) cells[key] = { country: ct, c2: c2, n: 0, gs: [], rows: [] };
    cells[key].n++; cells[key].gs.push(gv);
    cells[key].rows.push(rj);
  }
  var ck;
  for (ck in cells) {
    if (!Object.prototype.hasOwnProperty.call(cells, ck)) continue;
    var cl = cells[ck], cg = avgArr(cl.gs);
    if (cl.n >= MKT_MIN_SAMPLE && cg !== null && cg >= MKT_MIN_GROWTH) {
      mkt.push({ country: cl.country, c2: cl.c2, n: cl.n, avgGrowth: cg, rows: cl.rows, key: ck });
    }
  }
  mkt.sort(function (a, b) { return b.avgGrowth - a.avgGrowth; });

  /* 增速品类：二级类目聚合，涨 + 还没被达人铺开 = 值得切 */
  var c2s = c2Stats(list);
  for (j = 0; j < c2s.length; j++) {
    var x = c2s[j];
    if (x.n >= GCAT_MIN_SAMPLE && x.avgGrowth !== null && x.avgGrowth >= GCAT_MIN_GROWTH) gcat.push(x);
  }
  gcat.sort(function (a, b) { return b.avgGrowth - a.avgGrowth; });

  /* 成分机会：成分被多个在涨的商品写进标题 = 这个成分在带增长 */
  var ings = ingStats(list);
  for (j = 0; j < ings.length; j++) {
    var y = ings[j];
    if (y.n >= ING_MIN_SAMPLE && y.medianGrowth !== null && y.medianGrowth >= ING_MIN_GROWTH) ingr.push(y);
  }
  ingr.sort(function (a, b) { return b.medianGrowth - a.medianGrowth || b.n - a.n; });

  function byGrowth(a, b) { return (numField(b, '环比增速') || 0) - (numField(a, '环比增速') || 0); }
  win.sort(byGrowth); blank.sort(byGrowth); ready.sort(byGrowth); newp.sort(byGrowth);
  fix.sort(function (a, b) { return (numField(b, '销量') || 0) - (numField(a, '销量') || 0); });
  risk.sort(function (a, b) { return (numField(b, '销量') || 0) - (numField(a, '销量') || 0); });
  return { win: win, fix: fix, blank: blank, ready: ready, risk: risk,
    mkt: mkt, gcat: gcat, newp: newp, ingr: ingr };
}

/* ---------- 7b. 引擎体检：诊断「为什么算不出结果」 ----------
   洞察规则要能算出来，前提是它依赖的字段在数据里真实存在。
   依赖「人工标」字段的规则，导入数据后永远命中 0——这不是「没机会」，
   是「还没标」。必须把这两件事分开告诉用户，否则引擎等于空转。 ---------- */
var RULES_NEED = {
  win: { name: '窗口期', need: ['环比增速'] },
  fix: { name: '改良机会', need: ['差评关键词'] },
  blank: { name: '空白赛道', need: ['与我方 SKU 重合度', '环比增速'] },
  ready: { name: '可落地', need: ['备案路径', '宣称支撑难度', '预估成本', '价格'] },
  risk: { name: '风险提醒', need: ['环比增速', '差评关键词'] },
  mkt: { name: '市场机会', need: ['国家/地区', '二级类目', '环比增速'] },
  gcat: { name: '增速品类', need: ['二级类目', '环比增速'] },
  newp: { name: '新品机会', need: ['上市日期', '环比增速'] },
  ingr: { name: '成分机会', need: ['核心功效成分', '环比增速'] }
};
function hasField(r, name) {
  var fd = fieldDef(name);
  if (!fd) return false;
  if (fd.t === 'number') return numField(r, name) !== null;
  return txtOf(r, name) !== '';
}
/* 规则健康度：有多少条数据具备这条规则的全部前提；缺哪些字段 */
function ruleHealth(list, key) {
  var need = RULES_NEED[key].need, miss = [], i, j;
  for (j = 0; j < need.length; j++) miss.push({ f: need[j], ok: 0, total: list.length });
  var full = 0;
  for (i = 0; i < list.length; i++) {
    var all = true;
    for (j = 0; j < need.length; j++) {
      if (hasField(list[i], need[j])) miss[j].ok++;
      else all = false;
    }
    if (all) full++;
  }
  var lacking = [];
  for (j = 0; j < miss.length; j++) if (miss[j].ok === 0) lacking.push(miss[j].f);
  var partial = [];
  for (j = 0; j < miss.length; j++) if (miss[j].ok > 0 && miss[j].ok < miss[j].total) partial.push(miss[j].f + '（' + miss[j].ok + '/' + miss[j].total + '）');
  return { full: full, lacking: lacking, partial: partial, need: need };
}
/* 人工字段缺口总览：哪些字段全表为 0，且平台拿不到 */
function manualGaps(list) {
  var out = [];
  for (var i = 0; i < FIELDS.length; i++) {
    var f = FIELDS[i];
    if (f.src !== 'manual') continue;
    var n = 0;
    for (var j = 0; j < list.length; j++) if (hasField(list[j], f.n)) n++;
    if (n === 0) out.push(f.n);
  }
  return out;
}
/* 某个规则下，哪些市场一条都参与不了（字段天然缺位，比如韩国的销量）
   把「有个市场在这条规则里根本不出声」直接点出来，比只给比例有用。 */
function ruleSkippedMarkets(list, key) {
  var need = RULES_NEED[key].need, mkTot = {}, mkOk = {}, i, j;
  for (i = 0; i < list.length; i++) {
    var m = txtOf(list[i], '所属市场') || '未标市场';
    mkTot[m] = (mkTot[m] || 0) + 1;
    var all = true;
    for (j = 0; j < need.length; j++) if (!hasField(list[i], need[j])) { all = false; break; }
    if (all) mkOk[m] = (mkOk[m] || 0) + 1;
  }
  var out = [];
  for (var k in mkTot) {
    if (!Object.prototype.hasOwnProperty.call(mkTot, k)) continue;
    if (!mkOk[k]) out.push(k + ' ' + mkTot[k] + ' 条');
  }
  return out;
}
/* 数据覆盖度：市场 × 品类 的条数矩阵。0 格就是盲区，本身就是结论 */
function coverageOf(list) {
  var mks = optionsFor('所属市场').map(function (o) { return o.text; });
  var cats = optionsFor('品类').map(function (o) { return o.text; });
  var grid = {}, i, j;
  for (i = 0; i < mks.length; i++) { grid[mks[i]] = {}; for (j = 0; j < cats.length; j++) grid[mks[i]][cats[j]] = 0; }
  var unmk = 0;
  for (i = 0; i < list.length; i++) {
    var m = txtOf(list[i], '所属市场'), c = txtOf(list[i], '品类');
    if (!m || !grid[m]) { unmk++; continue; }
    if (!c || grid[m][c] === undefined) continue;
    grid[m][c]++;
  }
  var blank = [];
  for (i = 0; i < mks.length; i++) for (j = 0; j < cats.length; j++) if (!grid[mks[i]][cats[j]]) blank.push(mks[i] + ' · ' + cats[j]);
  return { mks: mks, cats: cats, grid: grid, blank: blank, unmk: unmk, total: list.length };
}
/* 关键词在哪：用户筛了 A 品类但关键词其实命中 B 品类，或哪个市场有货 */
function kwWhere(kw) {
  if (!kw) return null;
  var k = String(kw).toLowerCase();
  var byCat = {}, byMk = {}, sample = [];
  for (var i = 0; i < state.list.length; i++) {
    var r = state.list[i];
    if (isDemoFilteredOut(r)) continue;
    var hay = [txtOf(r, '商品名称'), txtOf(r, '细分品类'), txtOf(r, '概念标签'), txtOf(r, '功效宣称'), txtOf(r, '核心功效成分'), txtOf(r, '质地描述')].join(' ').toLowerCase();
    if (hay.indexOf(k) < 0) continue;
    var c = txtOf(r, '品类') || '未分类', m = txtOf(r, '所属市场') || '未标市场';
    byCat[c] = (byCat[c] || 0) + 1;
    byMk[m] = (byMk[m] || 0) + 1;
    if (sample.length < 3) sample.push({ name: txtOf(r, '商品名称'), mk: m, cat: c, id: ridOf(r) });
  }
  var n = 0; for (var x in byCat) if (Object.prototype.hasOwnProperty.call(byCat, x)) n += byCat[x];
  return n ? { n: n, byCat: byCat, byMk: byMk, sample: sample } : null;
}
/* 示例/真实开关造成的过滤（覆盖度估算与列表过滤共用同一口径） */
function isDemoFilteredOut(r) { return (state.demoOnly && !isDemo(r)) || (state.realOnly && isDemo(r)); }
/* 近似词建议：搜「沐浴油」全库没有，但「沐浴」有——别让用户以为库里没这个东西 */
function kwSuggest(kw) {
  if (!kw || kw.length < 3) return null;
  var tries = [], cut;
  for (cut = 1; cut <= 3 && cut < kw.length; cut++) tries.push(kw.slice(0, kw.length - cut));
  for (var i = 0; i < tries.length; i++) {
    var w = kwWhere(tries[i]);
    if (w) return { term: tries[i], n: w.n, byMk: w.byMk, byCat: w.byCat, sample: w.sample };
  }
  return null;
}

/* ---------- 8. 渲染层（上层统一入口驱动，渲染函数之间互不调用） ---------- */
var RENDER = {};

/* ---- 内联 SVG 图表（手写，零依赖） ---- */
var MKT_COLOR = { '中国': '#0071E3', '韩国': '#D4537E', '日本': '#0E7C6B', '欧美': '#6E4BD1', '东南亚': '#B26A00' };
function mktColor(m) { return MKT_COLOR[m] || '#8E8E93'; }

function hbarSvg(items, opt) {
  opt = opt || {};
  var labelW = opt.labelW || 128, valW = opt.valW || 74;
  var W = 620, rowH = opt.rowH || 30;
  var barX = labelW + 8, barW = W - barX - valW;
  var max = 0;
  for (var i = 0; i < items.length; i++) { var v = Math.abs(items[i].v || 0); if (v > max) max = v; }
  if (max <= 0) max = 1;
  var H = items.length * rowH + 8;
  var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" role="img" style="display:block">';
  for (var j = 0; j < items.length; j++) {
    var it = items[j], y = j * rowH + 4;
    var w = Math.max(2, barW * (Math.abs(it.v || 0) / max));
    var col = it.color || opt.color || '#0071E3';
    s += '<text x="0" y="' + (y + 15) + '" font-size="12" fill="#6E6E73">' + esc(it.k) + '</text>';
    s += '<rect x="' + barX + '" y="' + (y + 5) + '" width="' + barW + '" height="10" rx="5" fill="#F0F0F3"/>';
    s += '<rect x="' + barX + '" y="' + (y + 5) + '" width="' + w.toFixed(1) + '" height="10" rx="5" fill="' + col + '"/>';
    s += '<text x="' + W + '" y="' + (y + 15) + '" font-size="12" fill="#1D1D1F" text-anchor="end">' + esc(it.t) + '</text>';
  }
  s += '</svg>';
  return s;
}

/* 增长动能 × 竞争密度散点：左上角即「窗口期」 */
function scatterSvg(list) {
  var pts = [], maxKol = 1, gMin = 1e9, gMax = -1e9, maxSales = 1;
  for (var i = 0; i < list.length; i++) {
    var r = list[i];
    var g = numField(r, '环比增速'), k = numField(r, '关联达人数');
    if (g === null || k === null) continue;
    var s = numField(r, '销售额'); if (s === null) s = 0;
    if (k > maxKol) maxKol = k;
    if (g < gMin) gMin = g;
    if (g > gMax) gMax = g;
    if (s > maxSales) maxSales = s;
    pts.push({ g: g, k: k, s: s, m: txtOf(r, '所属市场'), n: txtOf(r, '商品名称') });
  }
  if (!pts.length) return '<div class="empty">当前筛选下没有可绘制的同时含「增速 + 达人数」的商品</div>';
  if (gMax === gMin) { gMax = gMin + 1; }
  var W = 620, H = 300, x0 = 52, x1 = 606, y0 = 22, y1 = 252;
  var sq = Math.sqrt(maxKol) || 1;
  function px(k) { return x0 + (Math.sqrt(k) / sq) * (x1 - x0); }
  function py(g) { return y1 - ((g - gMin) / (gMax - gMin)) * (y1 - y0); }
  var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" role="img" style="display:block">';
  s += '<rect x="' + x0 + '" y="' + y0 + '" width="' + (x1 - x0) + '" height="' + (y1 - y0) + '" fill="#FAFAFC" rx="6"/>';
  s += '<rect x="' + x0 + '" y="' + y0 + '" width="' + ((x1 - x0) * 0.45) + '" height="' + ((y1 - y0) * 0.45) + '" fill="#EAF3FE" rx="6"/>';
  s += '<text x="' + (x0 + 9) + '" y="' + (y0 + 17) + '" font-size="11.5" fill="#0058B0">窗口期：达人少 · 增速高</text>';
  var ticks = 4;
  for (var t = 0; t <= ticks; t++) {
    var gy = y1 - (t / ticks) * (y1 - y0);
    var gv = Math.round(gMin + (t / ticks) * (gMax - gMin));
    s += '<line x1="' + x0 + '" y1="' + gy.toFixed(1) + '" x2="' + x1 + '" y2="' + gy.toFixed(1) + '" stroke="#E6E6EA" stroke-width="0.5"/>';
    s += '<text x="' + (x0 - 8) + '" y="' + (gy + 4).toFixed(1) + '" font-size="11" fill="#8E8E93" text-anchor="end">' + gv + '%</text>';
  }
  s += '<text x="' + x0 + '" y="' + (y1 + 20) + '" font-size="11" fill="#8E8E93">0</text>';
  s += '<text x="' + x1 + '" y="' + (y1 + 20) + '" font-size="11" fill="#8E8E93" text-anchor="end">' + maxKol + ' 个达人</text>';
  s += '<text x="' + ((x0 + x1) / 2) + '" y="' + (y1 + 20) + '" font-size="11" fill="#8E8E93" text-anchor="middle">关联达人数（越左越不挤）</text>';
  for (var j = 0; j < pts.length; j++) {
    var p = pts[j];
    var rr = 3.2 + 5.6 * (maxSales > 0 ? Math.sqrt(Math.max(p.s, 0) / maxSales) : 0);
    s += '<circle cx="' + px(p.k).toFixed(1) + '" cy="' + py(p.g).toFixed(1) + '" r="' + rr.toFixed(1)
      + '" fill="' + mktColor(p.m) + '" fill-opacity="0.5" stroke="' + mktColor(p.m) + '" stroke-width="1"><title>'
      + esc(p.n) + '｜' + esc(p.m) + '｜增速 ' + p.g + '%｜达人 ' + p.k + '</title></circle>';
  }
  s += '<text x="' + x0 + '" y="' + (H - 6) + '" font-size="11" fill="#8E8E93">气泡大小 = 销售额</text>';
  s += '</svg>';
  return s;
}

var RANK_TYPES = [
  { k: 'growth', n: '增速榜', hint: '按环比增速排序，找正在起量的品' },
  { k: 'sales', n: '销售额榜', hint: '按销售额排序，看谁在赚钱' },
  { k: 'kol', n: '达人密度榜', hint: '按关联达人数升序，越靠前越没人推' },
  { k: 'rating', n: '口碑榜', hint: '按评分排序，样本量不足的会标出来' },
  { k: 'refund', n: '退货率榜', hint: '按退货率降序，别人踩的坑就是你的机会' },
  { k: 'fresh', n: '新品榜', hint: '按上市日期排序，越靠前越新' }
];
function rankDef(k) { for (var i = 0; i < RANK_TYPES.length; i++) { if (RANK_TYPES[i].k === k) return RANK_TYPES[i]; } return RANK_TYPES[0]; }
function rankBarRatio(r, by, maxv) {
  if (by === 'growth') { var g = numField(r, '环比增速'); return g === null ? 0 : Math.max(0, Math.min(1, g / (maxv || 1))); }
  if (by === 'sales') { var s = numField(r, '销售额'); return s === null ? 0 : Math.max(0, Math.min(1, s / (maxv || 1))); }
  if (by === 'kol') { var k = numField(r, '关联达人数'); return k === null ? 0 : Math.max(0.04, 1 - Math.min(1, k / (maxv || 1))); }
  if (by === 'rating') { var rt = numField(r, '评分'); return rt === null ? 0 : Math.max(0, Math.min(1, (rt - 3) / 2)); }
  if (by === 'refund') { var rf = numField(r, '退货率'); return rf === null ? 0 : Math.max(0, Math.min(1, rf / (maxv || 1))); }
  return 0.5;
}
function rankMain(r, by) {
  if (by === 'growth') { var g = numField(r, '环比增速'); return '<span class="' + pctCls(g) + '">' + fmtPct(g) + '</span>'; }
  if (by === 'sales') return fmtBig(numField(r, '销售额'));
  if (by === 'kol') { var k = numField(r, '关联达人数'); return (k === null ? '—' : k) + ' <small>个达人</small>'; }
  if (by === 'rating') { var rt = numField(r, '评分'); return (rt === null ? '—' : rt) + ' <small>/ 5</small>'; }
  if (by === 'refund') { var rf = numField(r, '退货率'); return (rf === null ? '—' : rf + '%'); }
  return cnDate(r['上市日期']);
}
function rankSub(r, by) {
  if (by === 'growth') { var k = numField(r, '关联达人数'); return '达人 ' + (k === null ? '—' : k) + ' 个'; }
  if (by === 'sales') return '增速 ' + fmtPct(numField(r, '环比增速'));
  if (by === 'kol') return '增速 ' + fmtPct(numField(r, '环比增速'));
  if (by === 'rating') return '评价 ' + fmtNum(numField(r, '评价数'));
  if (by === 'refund') return '销量 ' + fmtBig(numField(r, '销量'));
  return '增速 ' + fmtPct(numField(r, '环比增速'));
}

RENDER.rank = function () {

  h += '</div></div>';
  v.innerHTML = h;

  for (var i = 0; i < SOURCES.length; i++) {
    var s = SOURCES[i];
    var lv = s.kind === 'manual' ? 'man' : (s.kind === 'kr' || s.k === 'KEV美妆圈' ? 'part' : 'ok');
    var lab = s.kind === 'manual' ? '人工填报' : (lv === 'ok' ? '四件套齐全' : '只有成分口碑');
    h += '<button type="button" class="src-card" data-imp-src="' + esc(s.k) + '">'
      + '<span class="sh">' + esc(s.k) + '<span class="badge ' + lv + '">' + lab + '</span></span>'
      + '<span class="sm">覆盖：' + esc(s.markets.join('、')) + '<br>能拿 ' + s.full.length + ' 类字段，缺 ' + s.miss.length + ' 类</span>'
      + '</button>';
  }
  h += '</div>';
  h += '<div style="margin-top:14px"><button type="button" class="btn sec" data-go="srcmap">看完整数据源地图（含取数路径与额度）</button></div>';
  return h;
}
function impStep2() {
  var s = srcDef(impSrc) || { k: impSrc, markets: [], full: [], miss: [], path: '', quota: '', chan: '' };
  var h = '<div class="card pad" style="margin-bottom:13px">'
    + '<div class="sh" style="display:flex;align-items:center;gap:7px;font-size:13px;font-weight:500;margin-bottom:7px">'
    + esc(s.k) + '<button type="button" class="mini" style="margin-left:auto" id="impBack">换一个源</button></div>'
    + '<div class="hint">能拿到：<b>' + esc(s.full.join('、')) + '</b></div>'
    + (s.miss.length ? '<div class="hint">拿不到：' + esc(s.miss.join('、')) + '　（这些字段要人工在商品档案里补）</div>' : '')
    + '<div class="hint">路径：' + esc(s.path) + '</div>'
    + '<div class="hint">额度：' + esc(s.quota) + '　通道：' + esc(s.chan) + '</div></div>';
  h += '<div style="margin-bottom:9px"><span class="hint">这批数据属于哪个市场</span><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:7px">';
  for (var i = 0; i < s.markets.length; i++) {
    h += '<button type="button" class="chip' + (impMkt === s.markets[i] ? ' on' : '') + '" data-imp-mkt="' + esc(s.markets[i]) + '">' + esc(s.markets[i]) + '</button>';
  }
  h += '</div></div>';
  h += '<div class="hint" style="margin-bottom:9px">从 ' + esc(s.k) + ' 导出的表格里，<b>连表头一起</b>整块复制粘到下面。列名自动识别，重复商品名自动跳过，「万 / k / 千」自动换算。</div>';
  h += '<div style="margin-bottom:8px"><button type="button" class="btn sec" id="impFill">填入一段示例</button></div>';
  h += '<textarea class="ta" id="impText" placeholder="商品名称\t销售额\t销量\t环比增速\t关联达人数\t客单价\t上架时间"></textarea>';
  h += '<div id="impCov" style="margin-top:12px"></div><div id="impStatus" style="margin-top:10px"></div>';
  return h;
}
function openImport() {
  impSrc = null; impMkt = '';
  openModal('批量导入 · 第 1 步 / 选数据来源', impStep1(),
    '<button type="button" class="btn sec" data-close="1">取消</button>'
    + '<button type="button" class="btn" id="impNext" disabled style="opacity:.45">下一步</button>');
  bindImpStep1();
}
function bindImpStep1() {
  $$('[data-imp-src]').forEach(function (b) {
    b.addEventListener('click', function () {
      impSrc = b.getAttribute('data-imp-src');
      var s = srcDef(impSrc) || { markets: [] };
      impMkt = s.markets.length ? s.markets[0] : '';
      $$('[data-imp-src]').forEach(function (x) { x.classList.toggle('on', x === b); });
      var nb = $('#impNext');
      if (nb) { nb.disabled = false; nb.style.opacity = '1'; }
    });
  });
  var nb = $('#impNext');
  if (nb) nb.addEventListener('click', function () {
    if (!impSrc) { toast('先选一个数据来源'); return; }
    openImpStep2();
  });
}
function openImpStep2() {
  openModal('批量导入 · 第 2 步 / ' + impSrc, impStep2(),
    '<button type="button" class="btn sec" data-close="1">取消</button>'
    + '<button type="button" class="btn sec" id="impParse">识别列名</button>'
    + '<button type="button" class="btn" id="impGo" disabled style="opacity:.45">确认导入</button>');
  $$('[data-imp-mkt]').forEach(function (b) {
    b.addEventListener('click', function () {
      impMkt = b.getAttribute('data-imp-mkt');
      $$('[data-imp-mkt]').forEach(function (x) { x.classList.toggle('on', x === b); });
    });
  });
  var back = $('#impBack');
  if (back) back.addEventListener('click', function () { openImport(); });
  var ta = $('#impText');
  var cached = draftRead();
  if (cached) {
    ta.value = cached;
    $('#impStatus').innerHTML = '<div class="hint">已恢复上次未提交的内容（本机缓存）。</div>';
  }
  ta.addEventListener('input', function () { draftSave(ta.value); });
  $('#impFill').addEventListener('click', function () {
    ta.value = '商品名称\t销售额\t销量\t环比增速\t关联达人数\t客单价\t上架时间\n'
      + '某品牌 舒缓修护面霜 50ml\t1266万\t42000\t86\t9\t301\t2026-08-12\n'
      + '某品牌 控油洁面 120g\t1890万\t210000\t68\t14\t90\t2026-08-11\n'
      + '某品牌 身体磨砂膏 250g\t1170万\t74000\t12\t210\t158\t2026-03-25';
    draftSave(ta.value);
  });
  $('#impParse').addEventListener('click', doParseImport);
  $('#impGo').addEventListener('click', doWriteImport);
}
function openModal(title, body, foot) {
  $('#modal').classList.remove('wide');
  $('#modal').innerHTML = '<div class="md-hd"><h3>' + esc(title) + '</h3>'
    + '<button type="button" class="icon-btn" data-close="1" aria-label="关闭">'
    + '<svg class="ic" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>'
    + '<div class="md-bd">' + body + '</div><div class="md-ft">' + foot + '</div>';
  $('#modal').classList.add('on');
  $('#mask').classList.add('on');
}
function download(name, text, mime) {
  try {
    var blob = new Blob([text], { type: (mime || 'application/json') + ';charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 400);
    toast('已导出 ' + name);
  } catch (e) { toast('导出失败，请检查浏览器权限'); }
}
function rowsForExport() {
  var list = dataOf(), out = [];
  for (var i = 0; i < list.length; i++) {
    var o = {};
    for (var j = 0; j < FIELDS.length; j++) {
      var f = FIELDS[j];
      o[f.n] = (f.t === 'number') ? numField(list[i], f.n) : txtOf(list[i], f.n);
    }
    o._id = ridOf(list[i]);
    out.push(o);
  }
  return out;
}
function openMore() {
  var demoN = 0;
  for (var i = 0; i < state.list.length; i++) { if (isDemo(state.list[i])) demoN++; }
  var body = '<div class="hint">当前共 <b>' + state.list.length + '</b> 条商品数据，其中示例数据 <b>' + demoN + '</b> 条。'
    + (ONLINE ? '数据实时存在资料库云端，任意设备打开都是同一份。' : (IS_LOCAL ? '你现在打开的是本机那份文件，云端通道没接上，改动只留在这台设备。要和其他设备共用同一份数据，用下面的「打开线上版」。' : '线上通道暂未就绪，先存在这台设备上。')) + '</div>'
    + '<div class="hint" style="margin-top:10px">导出的 JSON 是完整快照，可作为备份留档；CSV 方便直接丢进 Excel 过一遍。</div>';
  var foot = (ONLINE ? '' : '<button type="button" class="btn" id="btnOnline2">打开线上版 · 云端同步</button>')
    + '<button type="button" class="btn sec" id="btnClearDemo"' + (demoN ? '' : ' disabled style="opacity:.45"') + '>清空示例数据</button>'
    + '<button type="button" class="btn sec" id="btnCsv">导出 CSV</button>'
    + '<button type="button" class="btn" id="btnJson">导出 JSON</button>';
  openModal('数据管理', body, foot);
  $('#btnJson').addEventListener('click', function () {
    download('global-selection-' + dayStr(new Date()) + '.json', JSON.stringify({ exportedAt: new Date().toISOString(), count: state.list.length, records: rowsForExport() }, null, 2));
  });
  $('#btnCsv').addEventListener('click', function () {
    var names = FIELDS.map(function (f) { return f.n; });
    var lines = [names.join(',')];
    rowsForExport().forEach(function (o) {
      lines.push(names.map(function (n) {
        var v = o[n];
        if (v == null) return '';
        var s = String(v).replace(/"/g, '""');
        return /[",\n]/.test(s) ? '"' + s + '"' : s;
      }).join(','));
    });
    download('global-selection-' + dayStr(new Date()) + '.csv', '\ufeff' + lines.join('\n'), 'text/csv');
  });
  $('#btnClearDemo').addEventListener('click', clearDemo);
  var bO2 = $('#btnOnline2');
  if (bO2) bO2.addEventListener('click', function () { window.open(ONLINE_URL, '_blank'); });
}
function clearDemo() {
  var targets = state.list.filter(isDemo);
  if (!targets.length) { toast('没有示例数据'); return; }
  if (!window.confirm('确定清空 ' + targets.length + ' 条示例数据？\n\n只会删掉标记为「示例」的记录，你自己导入的真实数据不受影响。此操作不可撤销。')) return;
  closeAll();
  var chain = Promise.resolve(), ok = 0;
  targets.forEach(function (r) {
    var rid = ridOf(r);
    chain = chain.then(function () { return removeOne(rid).then(function () { ok++; }).catch(function () { }); });
  });
  chain.then(function () { toast('已清空 ' + ok + ' 条示例数据'); return loadAll(); }).then(refreshAll);
}

/* ---------- 12. 事件绑定（统一入口调度，不在渲染函数里触发渲染） ---------- */
function bindEvents() {
  document.addEventListener('click', function (e) {
    var el = e.target && e.target.closest ? e.target.closest('[data-view],[data-f],[data-rank],[data-open],[data-close],[data-go]') : null;
    if (!el) return;
    if (el.hasAttribute('data-close')) { closeAll(); return; }
    if (el.hasAttribute('data-go')) {
      var g = el.getAttribute('data-go');
      if (g === 'import') { closeAll(); openImport(); }
      else if (g === 'srcmap') openSrcMap();
      else if (g === 'export') { closeAll(); openMore(); }
      return;
    }
    if (el.hasAttribute('data-view')) { state.view = el.getAttribute('data-view'); closeAll(); refreshAll(); return; }
    if (el.hasAttribute('data-f')) {
      var f = el.getAttribute('data-f'), v = el.getAttribute('data-v');
      if (f === 'demoOnly') { state.demoOnly = (v === '1'); if (state.demoOnly) state.realOnly = false; }
      else if (f === 'realOnly') { state.realOnly = (v === '1'); if (state.realOnly) state.demoOnly = false; }
      else state[f] = v;
      if (f === 'kw') { var ki = $('#kw'); if (ki) ki.value = state.kw; }
      refreshAll(); return;
    }
    if (el.hasAttribute('data-rank')) { state.rankBy = el.getAttribute('data-rank'); refreshAll(); return; }
    if (el.hasAttribute('data-open')) { openDetail(el.getAttribute('data-open')); return; }
  });
  $('#mask').addEventListener('click', closeAll);
  $('#btnImport').addEventListener('click', openImport);
  $('#btnExport').addEventListener('click', openMore);
  $('#btnMore').addEventListener('click', openMore);
  var bo = $('#btnOnline');
  if (bo) bo.addEventListener('click', function () { window.open(ONLINE_URL, '_blank'); });
  var kw = $('#kw');
  var timer = null;
  kw.addEventListener('input', function () {
    clearTimeout(timer);
    timer = setTimeout(function () { state.kw = kw.value.trim(); refreshAll(); }, 220);
  });
  /* 下拉筛选 + 品类树展开 + 库内 Tab：一律「改 state → refreshAll」，不在渲染里触发渲染 */
  $('#chips').addEventListener('change', function (e) {
    var el = e.target;
    if (!el || !el.getAttribute) return;
    var f = el.getAttribute('data-f-sel');
    if (!f) return;
    state[f] = el.value;
    refreshAll();
  });
  $('#view').addEventListener('click', function (e) {
    var t = e.target && e.target.closest ? e.target.closest('[data-exp],[data-tab]') : null;
    if (!t) return;
    var tb = t.getAttribute('data-tab');
    if (tb) { state.libTab = tb; refreshAll(); return; }
    var lv = t.getAttribute('data-exp'), k = t.getAttribute('data-expk') || '';
    if (lv === 'l1') { if (state.expL1[k]) delete state.expL1[k]; else state.expL1[k] = 1; }
    else if (lv === 'l2') { if (state.expL2[k]) delete state.expL2[k]; else state.expL2[k] = 1; }
    refreshAll();
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeAll(); });
}

function init() {
  bindEvents();
  seedLocalIfEmpty();
  subscribeUpdates();
  refreshAll();
  loadAll().then(refreshAll);
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();
</script>
</body>
</html>
